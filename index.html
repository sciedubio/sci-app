<!DOCTYPE html>
<html lang="ko" :class="{ 'dark': isDarkMode }" x-data="appData" x-init="initTheme()">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>과학 웹앱 허브</title>
  
  <meta name="theme-color" content="#0f172a" id="theme-color-meta">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🧪</text></svg>">
  
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Noto Sans KR', '-apple-system', 'sans-serif'] },
          colors: {
            /* 라이트모드: 네이처 에코 (싱그러운 그린 톤) */
            brand: { 50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0', 500: '#22c55e', 600: '#16a34a', 900: '#14532d' },
            /* 다크모드: 사이버 랩 (네온 시안/핑크 유지) */
            neon: { cyan: '#00f2fe', pink: '#ec4899' },
            space: { 800: '#131c31', 900: '#0b1120', 950: '#060a13' }
          },
          boxShadow: {
            'neon-cyan': '0 0 10px rgba(0, 242, 254, 0.4), 0 0 20px rgba(0, 242, 254, 0.2)',
            'neon-pink': '0 0 8px rgba(236, 72, 153, 0.6)',
            'soft': '0 10px 25px -5px rgba(0, 0, 0, 0.05)',
            'dark-float': '0 15px 30px -5px rgba(0, 0, 0, 0.4)'
          }
        }
      }
    }
  </script>
  
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    body {
      background-color: #edf2ec; 
      color: #3f4e4f; /* 눈이 편안한 짙은 잎새/브라운 톤 */
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    
    /* 심우주 다크모드 배경 */
    .dark body {
      background-color: #0b1120;
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(6, 182, 212, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.05) 0%, transparent 50%);
      color: #f1f5f9;
    }

    [x-cloak] { display: none !important; }
    
    /* iOS 줌 방지를 위해 입력 요소는 16px 고정 */
    input, textarea, select { user-select: auto; font-size: 16px !important; } 
    
    .h-screen-safe { height: 100dvh; height: calc(var(--vh, 1vh) * 100); }
    
    /* 스크롤바 커스텀 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .dark ::-webkit-scrollbar-thumb:hover { background: #475569; }
    
    /* 팝업 등 애니메이션 */
    @keyframes slideUpFade { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-popup { animation: slideUpFade 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }
    .shake { animation: shake 0.3s ease-in-out 0s 2; }
    
    #qrcode img, #qrcode canvas { margin: 0 auto; max-width: 100%; width: 100%; height: auto; border-radius: 8px; image-rendering: pixelated; }
  </style>

  <script>
    // AudioContext 기반 효과음 엔진
    const SoundFX = (() => {
      let ctx = null, master = null;
      function init() {
        if (!ctx) {
          try {
            ctx = new (window.AudioContext || window.webkitAudioContext)();
            master = ctx.createGain(); master.gain.value = 0.4; master.connect(ctx.destination);
          } catch (e) { ctx = null; }
        }
        if (ctx && ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
        return ctx;
      }
      function playTone(freqArr, dur, type, vol) {
        const c = init(); if (!c) return;
        const t0 = c.currentTime; const osc = c.createOscillator(); const g = c.createGain();
        osc.type = type;
        if(Array.isArray(freqArr)) { osc.frequency.setValueAtTime(freqArr[0], t0); osc.frequency.exponentialRampToValueAtTime(freqArr[1], t0 + dur); } 
        else { osc.frequency.setValueAtTime(freqArr, t0); }
        g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(g); g.connect(master); osc.start(t0); osc.stop(t0 + dur + 0.05);
      }
      return {
        tap: () => playTone(880, 0.05, 'sine', 0.1),
        open: () => { playTone(523, 0.08, 'sine', 0.1); setTimeout(()=>playTone(784, 0.1, 'sine', 0.15), 60); },
        success: () => { playTone(523, 0.1, 'triangle', 0.1); setTimeout(()=>playTone(659, 0.1, 'triangle', 0.1), 100); setTimeout(()=>playTone(784, 0.2, 'triangle', 0.15), 200); },
        error: () => playTone([300, 150], 0.2, 'sawtooth', 0.15),
        switch: () => { playTone([1200, 600], 0.08, 'sine', 0.05); }
      };
    })();

    // 햅틱 엔진
    const Haptic = (() => {
      const enabled = ('vibrate' in navigator);
      return {
        tap: () => { if(enabled) try{ navigator.vibrate(10); }catch(e){} },
        heavy: () => { if(enabled) try{ navigator.vibrate(30); }catch(e){} }
      };
    })();

    const triggerTap = () => { SoundFX.tap(); Haptic.tap(); };
    const triggerAction = () => { SoundFX.open(); Haptic.tap(); };
    const triggerTheme = () => { SoundFX.switch(); Haptic.tap(); };
  </script>
</head>

<body class="transition-colors duration-300">
  
  <div x-show="toast.show" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-4" x-transition:enter-end="opacity-100 translate-y-0" x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100 translate-y-0" x-transition:leave-end="opacity-0 translate-y-4"
       class="fixed bottom-20 left-1/2 transform -translate-x-1/2 z-[200] bg-slate-800 dark:bg-brand-500 text-white px-5 py-3 rounded-full shadow-dark-float text-sm font-bold pointer-events-none whitespace-nowrap flex items-center gap-2" style="margin-bottom: var(--safe-bottom)" x-cloak>
    <span class="text-lg" x-text="toast.icon || '✨'"></span>
    <span x-text="toast.message"></span>
  </div>

  <div class="h-screen-safe flex flex-col w-full max-w-screen-xl mx-auto relative overflow-hidden bg-[#fdfcf9]/80 dark:bg-space-950/40 backdrop-blur-sm ring-1 ring-slate-200 dark:ring-slate-800/50">
    
    <!-- 사이드바 오버레이 -->
    <div x-show="isSidebarOpen" x-transition.opacity class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50" @click="isSidebarOpen = false; triggerTap()" x-cloak></div>
    
    <!-- 사이드바 -->
    <div class="fixed inset-y-0 left-0 w-64 bg-white dark:bg-space-800 shadow-2xl dark:shadow-dark-float z-[60] transform transition-transform duration-300 ease-in-out flex flex-col border-r border-slate-200 dark:border-slate-700/50"
         :class="isSidebarOpen ? 'translate-x-0' : '-translate-x-full'" x-cloak>
      <div class="p-5 bg-gradient-to-r from-brand-500 to-brand-600 dark:from-space-900 dark:to-space-800 flex justify-between items-center text-white border-b dark:border-slate-700/50" style="padding-top: max(20px, var(--safe-top))">
        <h2 class="font-bold text-lg tracking-tight flex items-center gap-2"><span class="text-brand-200 dark:text-neon-cyan">📂</span> 메뉴 선택</h2>
        <button @click="isSidebarOpen = false; triggerTap()" class="p-2 hover:bg-white/20 rounded-full transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <div class="flex-1 overflow-y-auto p-3 flex flex-col gap-1 pb-10">
        <template x-for="cat in allCategories" :key="cat">
          <button @click="selectCategory(cat)"
                  class="px-4 py-3 rounded-xl font-bold text-left transition-all active:scale-95 flex items-center justify-between"
                  :class="(!showFavoritesOnly && selectedCategory === cat) ? 'bg-brand-50 dark:bg-brand-900/30 text-brand-600 dark:text-neon-cyan ring-1 ring-brand-200 dark:ring-brand-500/50' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50'">
            <span x-text="cat" class="text-sm"></span>
            <svg x-show="!showFavoritesOnly && selectedCategory === cat" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
          </button>
        </template>
      </div>
    </div>

    <header class="sticky top-0 z-40 bg-white/80 dark:bg-space-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 py-3 flex justify-between items-center transition-all" style="padding-top: max(12px, var(--safe-top))">
      <div class="flex items-center gap-3">
        <template x-if="view === 'main'">
          <button @click="isSidebarOpen = true; triggerTap()" class="p-2 -ml-2 text-slate-500 dark:text-slate-400 hover:text-brand-600 dark:hover:text-neon-cyan hover:bg-brand-50 dark:hover:bg-slate-800 rounded-full transition-colors active:scale-90">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
          </button>
        </template>
        <template x-if="view !== 'main'">
          <button @click="goBack(); triggerTap()" class="px-3 py-1.5 -ml-2 text-sm font-bold text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-full transition-colors active:scale-95 flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg> 뒤로
          </button>
        </template>
        
        <h1 class="text-xl font-black text-slate-800 dark:text-white tracking-tight flex items-center gap-2 cursor-pointer active:scale-95 transition-transform" @click="goHome(); triggerTap()">
          <span class="text-2xl drop-shadow-sm dark:drop-shadow-[0_0_8px_rgba(0,242,254,0.6)]">🧪</span> 과학 허브
        </h1>
      </div>
      
      <div class="flex items-center gap-2">
        <!-- 테마 토글 버튼 -->
        <button @click="toggleTheme()" class="w-9 h-9 flex items-center justify-center rounded-full text-slate-500 dark:text-yellow-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors active:scale-90" title="테마 변경">
          <svg x-show="!isDarkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
          <svg x-show="isDarkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" x-cloak><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        </button>

        <button @click="openModal('guide'); triggerTap()" class="w-9 h-9 flex items-center justify-center rounded-full text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors active:scale-90" title="가이드">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </button>

        <template x-if="view === 'main'">
          <button @click="openModal('password'); triggerTap()" class="px-3 py-1.5 rounded-full text-xs font-bold text-brand-600 dark:text-neon-cyan bg-brand-50 dark:bg-space-800 border border-brand-200 dark:border-brand-500/30 hover:bg-brand-100 dark:hover:bg-space-700 active:scale-95 transition-all flex items-center gap-1 shadow-sm">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg> 관리
          </button>
        </template>
      </div>
    </header>
    
    <div class="flex-1 overflow-y-auto relative z-10 w-full pb-24 scroll-smooth">
      
      <!-- 1. Main View -->
      <template x-if="view === 'main'">
        <main class="p-4 sm:p-6 flex flex-col gap-4 h-full animate-popup">
          
          <div class="flex flex-col gap-3">
            <div class="flex justify-between items-end">
              <h2 class="text-lg font-bold text-slate-700 dark:text-slate-100 flex items-center gap-2">
                <span x-show="showFavoritesOnly" class="text-yellow-400 drop-shadow-sm">⭐ 내 즐겨찾기</span>
                <span x-show="!showFavoritesOnly" class="text-brand-600 dark:text-neon-cyan" x-text="'📂 ' + selectedCategory"></span>
              </h2>
              <button @click="toggleFavoritesMode(); triggerTap()" class="px-3 py-1.5 rounded-full text-xs font-bold transition-all shadow-sm active:scale-95"
                      :class="showFavoritesOnly ? 'bg-slate-700 dark:bg-yellow-400 dark:text-slate-900 text-white' : 'bg-white dark:bg-space-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700'">
                <span x-text="showFavoritesOnly ? '전체 보기' : '⭐ 모아보기'"></span>
              </button>
            </div>
            
            <div class="relative group">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 group-focus-within:text-brand-500 dark:group-focus-within:text-neon-cyan transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
              </div>
              <input type="text" x-model="searchQuery" placeholder="이름, 단원, 태그로 빠르게 검색..." 
                     class="w-full pl-10 pr-4 py-3 bg-white dark:bg-space-800 border border-transparent dark:border-slate-700 rounded-2xl shadow-soft dark:shadow-none text-sm text-slate-700 dark:text-slate-200 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 dark:focus:ring-neon-cyan transition-all" />
              <button x-show="searchQuery" @click="searchQuery = ''; triggerTap()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
              </button>
            </div>
          </div>

          <!-- 소분류 탭 -->
          <template x-if="!showFavoritesOnly && !searchQuery.trim()">
            <div class="flex flex-wrap gap-2 mt-1">
              <template x-for="unit in studentAvailableUnits" :key="unit">
                <button @click="selectedUnit = unit; triggerTap()" class="px-3.5 py-1.5 rounded-full text-xs font-bold transition-all active:scale-95"
                        :class="selectedUnit === unit ? 'bg-brand-500 dark:bg-brand-600 text-white shadow-md dark:shadow-neon-cyan border border-transparent dark:border-neon-cyan/50' : 'bg-white dark:bg-space-800 text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700'">
                  <span x-text="unit"></span>
                </button>
              </template>
            </div>
          </template>

          <!-- 앱 카드 그리드 (PC 모니터에서 3~4열 반응형 지원) -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 mt-2">
            <template x-for="app in displayedApps" :key="app.id">
              <div class="group bg-white dark:bg-space-800 rounded-2xl p-4 shadow-soft dark:shadow-none hover:shadow-float dark:hover:shadow-neon-cyan border border-slate-100 dark:border-slate-700/50 hover:border-brand-200 dark:hover:border-neon-cyan/50 transition-all duration-300 flex flex-col relative h-full">
                
                <button @click.stop="toggleFavorite(app.id); triggerTap()" class="absolute top-3 right-3 p-1.5 rounded-full z-10 transition-transform active:scale-75 hover:bg-slate-50 dark:hover:bg-slate-700" title="즐겨찾기">
                  <svg class="w-6 h-6 transition-colors" :class="favorites.includes(app.id) ? 'fill-yellow-400 text-yellow-400' : 'fill-none text-slate-300 dark:text-slate-600'" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg>
                </button>

                <div class="flex items-start gap-4 mb-3 pr-8">
                  <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-slate-50 to-slate-100 dark:from-space-900 dark:to-space-950 border border-slate-200 dark:border-slate-700 shadow-sm flex items-center justify-center text-3xl shrink-0 relative group-hover:scale-105 transition-transform">
                    <span x-text="app.emoji"></span>
                    <template x-if="app.isHot || isAutoHot(app)">
                      <span class="absolute -top-2 -right-2 bg-red-500 dark:bg-neon-pink text-white text-[9px] px-1.5 py-0.5 font-bold rounded shadow-sm dark:shadow-neon-pink transform rotate-12 ring-2 ring-white dark:ring-space-800">HOT</span>
                    </template>
                  </div>
                  
                  <div class="min-w-0 flex-1 pt-0.5">
                    <div class="text-[10px] text-brand-600 dark:text-cyan-400 font-bold tracking-tight mb-1 truncate" x-text="app.category + ' > ' + app.unit"></div>
                    <h3 class="font-bold text-[15px] text-slate-800 dark:text-slate-100 leading-snug break-keep group-hover:text-brand-600 dark:group-hover:text-neon-cyan transition-colors" x-text="app.name"></h3>
                    <div class="text-[11px] text-slate-400 dark:text-slate-500 mt-1.5 flex items-center gap-1">
                      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                      <span x-text="app.views || 0"></span>
                    </div>
                  </div>
                </div>
                
                <template x-if="app.tags">
                  <div class="flex flex-wrap gap-1 mb-3">
                    <template x-for="tag in String(app.tags).split(',').map(t=>t.trim()).filter(Boolean)" :key="tag">
                      <button @click="searchQuery = tag; triggerTap()" class="text-[10px] bg-slate-100 dark:bg-slate-700/50 text-slate-500 dark:text-slate-300 px-2 py-0.5 font-medium rounded-md hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors border border-transparent dark:border-slate-600">
                        #<span x-text="tag"></span>
                      </button>
                    </template>
                  </div>
                </template>
                
                <div class="mt-auto pt-3 flex gap-2 border-t border-slate-50 dark:border-slate-700/50">
                  <button @click="openQrModal(app); triggerTap()" class="w-10 h-10 rounded-xl bg-slate-50 dark:bg-space-900 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 flex justify-center items-center active:scale-90 transition-all border border-slate-200 dark:border-slate-600" title="QR 보기">

  <script>
    // ⚠️ 아래 주소에 새로 발급받은 앱스 스크립트 웹앱 주소를 넣으세요.
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzLw7Cewdmx7BboqpQZt7FNg1XysMJwgdNSJRqmmcGbkWJgxO8fjqX1uXCf4L_xXOo/exec"; 
    const SHEET_NAME = "Apps";
    
    const UNITS = ['1단원', '2단원', '3단원', '4단원', '5단원', '6단원', '7단원', '8단원'];
    const DEFAULT_CATEGORIES = ['중1 과학', '중2 과학', '중3 과학', '수업 영상', '공지/정보'];

    const setVH = () => document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
    window.addEventListener('resize', setVH); setVH();
    
    const naturalSort = (a, b) => new Intl.Collator('ko', { numeric: true, sensitivity: 'base' }).compare(a, b);

    document.addEventListener('alpine:init', () => {
      Alpine.data('appData', () => ({
        isDarkMode: false,
        view: 'main', apps: [], loading: false,
        selectedCategory: '중2 과학', selectedUnit: '전체', isSidebarOpen: false,
        searchQuery: '', favorites: [], showFavoritesOnly: false,
        
        serverPw: '', 
        modal: { type: null, data: null },
        adminCategoryFilter: '전체', adminUnitFilter: '전체',
        
        formData: {}, formError: '', formShake: false,
        lastCategory: '중2 과학', lastUnit: '1단원',
        isCustomCat: false, isCustomUnit: false,
        
        backPressedOnce: false,
        toast: { show: false, message: '', icon: '' },
        
        gasCodeText: `const SHEET_NAME = '${SHEET_NAME}';
function doGet(e) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName(SHEET_NAME);
  var settingsSheet = ss.getSheetByName('Settings');
  var adminPw = '';
  if(settingsSheet) { adminPw = String(settingsSheet.getRange(1, 2).getValue()).trim(); } 
  else { settingsSheet = ss.insertSheet('Settings'); settingsSheet.appendRow(['관리자 비밀번호', 'science123']); adminPw = 'science123'; }
  if(!sheet) return ContentService.createTextOutput(JSON.stringify({apps: [], adminPw: adminPw})).setMimeType(ContentService.MimeType.JSON);
  var data = sheet.getDataRange().getValues(); var result = [];
  if(data.length >= 2) {
    var headers = data[0];
    for(var i=1; i<data.length; i++) { var obj = {}; for(var j=0; j<headers.length; j++) obj[headers[j]] = data[i][j]; result.push(obj); }
  }
  return ContentService.createTextOutput(JSON.stringify({apps: result, adminPw: adminPw})).setMimeType(ContentService.MimeType.JSON);
}
function doPost(e) {
  var lock = LockService.getScriptLock();
  try { lock.waitLock(10000); } catch(err) { return ContentService.createTextOutput(JSON.stringify({result: 'error', message: '서버 혼잡'})).setMimeType(ContentService.MimeType.JSON); }
  try {
    var ss = SpreadsheetApp.getActiveSpreadsheet(); var sheet = ss.getSheetByName(SHEET_NAME) || ss.insertSheet(SHEET_NAME);
    var req = JSON.parse(e.postData.contents); var action = req.action; var data = req.data;
    if (action === 'create' || action === 'update') data.timestamp = new Date().toISOString();
    var lastCol = sheet.getLastColumn(); var headers = lastCol > 0 ? sheet.getRange(1, 1, 1, lastCol).getValues()[0] : [];
    if (headers.length === 0) {
      headers = ['timestamp'].concat(Object.keys(data).filter(function(k){ return k !== 'timestamp'; }));
      sheet.appendRow(headers); sheet.getRange(1, 1, 1, headers.length).setFontWeight('bold').setBackground('#4a86e8').setFontColor('#ffffff');
    } else {
      if (headers[0] !== 'timestamp') { headers.unshift('timestamp'); sheet.insertColumnBefore(1); sheet.getRange(1,1).setValue('timestamp'); }
      for (var key in data) { if (headers.indexOf(key) === -1) { headers.push(key); sheet.getRange(1, headers.length).setValue(key); } }
    }
    if (action === 'incrementView') {
      var sheetData = sheet.getDataRange().getValues(); var viewIdx = headers.indexOf('views');
      if(viewIdx === -1) { headers.push('views'); sheet.getRange(1, headers.length).setValue('views'); viewIdx = headers.length - 1; }
      for(var i=1; i<sheetData.length; i++) {
        if(sheetData[i][headers.indexOf('id')] === data.id) { var currView = parseInt(sheetData[i][viewIdx]) || 0; sheet.getRange(i+1, viewIdx + 1).setValue(currView + 1); break; }
      }
    } else {
      var rowData = []; for (var j=0; j<headers.length; j++) rowData.push(data[headers[j]] !== undefined ? data[headers[j]] : '');
      if (action === 'create') { sheet.appendRow(rowData); } 
      else if (action === 'update') {
        var sheetData = sheet.getDataRange().getValues(); var idIdx = headers.indexOf('id');
        for(var i=1; i<sheetData.length; i++) { if(sheetData[i][idIdx] === data.id) { sheet.getRange(i+1, 1, 1, rowData.length).setValues([rowData]); break; } }
      } else if (action === 'delete') {
        var sheetData = sheet.getDataRange().getValues(); var idIdx = headers.indexOf('id');
        for(var i=1; i<sheetData.length; i++) { if(sheetData[i][idIdx] === data.id) { sheet.deleteRow(i+1); break; } }
      }
    }
    return ContentService.createTextOutput(JSON.stringify({ result: 'success' })).setMimeType(ContentService.MimeType.JSON);
  } catch(err) { return ContentService.createTextOutput(JSON.stringify({ result: 'error', message: err.toString() })).setMimeType(ContentService.MimeType.JSON);
  } finally { lock.releaseLock(); }
}`,

        initTheme() {
          const savedTheme = localStorage.getItem('science_hub_theme');
          if (savedTheme) {
            this.isDarkMode = savedTheme === 'dark';
          } else {
            this.isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          this.updateMetaColor();
        },
        
        toggleTheme() {
          this.isDarkMode = !this.isDarkMode;
          localStorage.setItem('science_hub_theme', this.isDarkMode ? 'dark' : 'light');
          this.updateMetaColor();
          triggerTheme();
        },

        updateMetaColor() {
          const meta = document.getElementById('theme-color-meta');
          if(meta) meta.setAttribute('content', this.isDarkMode ? '#0b1120' : '#f7f6f2');
        },

        init() {
          const savedFavs = localStorage.getItem('science_hub_favs');
          if (savedFavs) { try { this.favorites = JSON.parse(savedFavs); } catch (e) {} }
          
          this.$watch('formData', () => {
            if (this.view === 'form' && !this.formData.id) {
              clearTimeout(this.draftTimeout);
              this.draftTimeout = setTimeout(() => {
                localStorage.setItem('science_hub_draft', JSON.stringify(this.formData));
              }, 1000);
            }
          }, { deep: true });
          
          window.addEventListener('popstate', (e) => {
            if (this.modal.type && this.modal.type !== 'confirmExit') { this.closeModal(); return; }
            if (this.view === 'form') { history.pushState({view: 'form'}, ''); this.openModal('confirmExit'); return; }
            if (this.view === 'main' && !this.modal.type) {
              if (!this.backPressedOnce) {
                history.pushState({view: 'main'}, ''); this.backPressedOnce = true;
                this.showToast('한 번 더 누르면 종료됩니다.', '⚠️'); setTimeout(() => { this.backPressedOnce = false; }, 2000);
              } else { window.history.back(); } return;
            }
            this.view = (e.state && e.state.view) || 'main';
          });
          
          window.addEventListener('beforeunload', (e) => { if(this.view === 'form' && !this.formData.id) { e.preventDefault(); e.returnValue = ''; } });

          this.fetchApps();
        },

        showToast(msg, icon = '✨') {
          this.toast.message = msg; this.toast.icon = icon; this.toast.show = true;
          setTimeout(() => { this.toast.show = false; }, 2500);
        },

        async fetchApps() {
          if (!GOOGLE_SCRIPT_URL) return;
          this.loading = true;
          try {
            const res = await fetch(GOOGLE_SCRIPT_URL);
            const data = await res.json();
            this.serverPw = data.adminPw || ''; 
            const appsData = Array.isArray(data.apps) ? data.apps : (Array.isArray(data) ? data : []);
            this.apps = appsData.map(app => ({
              ...app,
              isHidden: app.isHidden === true || app.isHidden === 'true',
              isHot: app.isHot === true || app.isHot === 'true',
              views: parseInt(app.views) || 0,
              order: (app.order === '' || app.order == null) ? 999 : Number(app.order)
            }));
          } catch(err) {
            this.openModal('alert', '데이터 통신 실패! GAS 주소와 권한을 확인하세요.'); SoundFX.error();
          } finally { this.loading = false; }
        },

        async syncAppAction(action, data) {
          if (!GOOGLE_SCRIPT_URL) return true;
          if(action !== 'incrementView') this.loading = true;
          try {
            await Promise.race([
              fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, data }) }),
              new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 8000))
            ]);
            if(action === 'incrementView') { const app = this.apps.find(a=>a.id===data.id); if(app) app.views = (app.views||0)+1; } 
            else { await this.fetchApps(); }
            return true;
          } catch(err) {
            if(action !== 'incrementView') { this.openModal('alert', '네트워크 지연. 다시 시도해주세요.'); SoundFX.error(); }
            return false;
          } finally { if(action !== 'incrementView') this.loading = false; }
        },

        verifyAdmin() {
          const inputPw = document.getElementById('pwInput').value; if(!inputPw) return;
          if ((this.serverPw && inputPw === this.serverPw) || !GOOGLE_SCRIPT_URL) {
            this.closeModal(); this.goAdmin(); SoundFX.success();
          } else { this.openModal('alert', '비밀번호가 일치하지 않습니다.'); SoundFX.error(); }
        },

        goHome() { this.view = 'main'; this.searchQuery = ''; this.showFavoritesOnly = false; history.pushState({view: 'main'}, ''); },
        goAdmin() { this.view = 'admin'; history.pushState({view: 'admin'}, ''); },
        goBack() { history.back(); },
        
        get allCategories() { return Array.from(new Set([...DEFAULT_CATEGORIES, ...this.apps.map(a=>a.category).filter(Boolean)])).sort(naturalSort); },
        get allUnits() { return Array.from(new Set([...UNITS, ...this.apps.map(a=>a.unit).filter(Boolean)])).sort(naturalSort); },
        get studentAvailableUnits() {
          const u = this.apps.filter(a => a.category === this.selectedCategory && !a.isHidden).map(a => a.unit);
          return ['전체', ...Array.from(new Set(u)).sort(naturalSort)];
        },
        get adminAvailableUnits() {
          if (this.adminCategoryFilter === '전체') return ['전체', ...this.allUnits];
          return ['전체', ...Array.from(new Set(this.apps.filter(a => a.category === this.adminCategoryFilter).map(a => a.unit))).sort(naturalSort)];
        },
        
        get top3ViewsIds() { return [...this.apps].filter(a => !a.isHidden && (a.views||0) > 0).sort((a,b) => b.views - a.views).slice(0,3).map(a=>a.id); },
        isAutoHot(app) { return this.top3ViewsIds.includes(app.id); },
        isFuture(dateStr) { return dateStr ? new Date(dateStr) > new Date() : false; },

        get displayedApps() {
          let f = this.apps.filter(a => !a.isHidden && !this.isFuture(a.openDate));
          if (this.showFavoritesOnly) { f = f.filter(a => this.favorites.includes(a.id)); } 
          else {
            f = f.filter(a => a.category === this.selectedCategory);
            if (this.selectedUnit !== '전체') f = f.filter(a => a.unit === this.selectedUnit);
          }
          if (this.searchQuery.trim()) {
            const q = this.searchQuery.toLowerCase();
            f = this.apps.filter(a => !a.isHidden && !this.isFuture(a.openDate) && 
                (a.name.toLowerCase().includes(q) || a.category.toLowerCase().includes(q) || 
                 a.unit.toLowerCase().includes(q) || (a.tags && String(a.tags).toLowerCase().includes(q))));
          }
          return f.sort((a,b) => {
            const oA = (a.order === '' || a.order == null) ? 999 : Number(a.order);
            const oB = (b.order === '' || b.order == null) ? 999 : Number(b.order);
            if (oA !== oB) return oA - oB; return new Date(b.date) - new Date(a.date);
          });
        },
        get adminDisplayedApps() {
          let f = this.apps;
          if (this.adminCategoryFilter !== '전체') f = f.filter(a => a.category === this.adminCategoryFilter);
          if (this.adminUnitFilter !== '전체') f = f.filter(a => a.unit === this.adminUnitFilter);
          return f.sort((a,b) => {
            const oA = (a.order === '' || a.order == null) ? 999 : Number(a.order);
            const oB = (b.order === '' || b.order == null) ? 999 : Number(b.order);
            if (oA !== oB) return oA - oB; return new Date(b.date) - new Date(a.date);
          });
        },

        selectCategory(cat) { this.selectedCategory = cat; this.selectedUnit = '전체'; this.showFavoritesOnly = false; this.isSidebarOpen = false; },
        toggleFavoritesMode() { this.showFavoritesOnly = !this.showFavoritesOnly; this.searchQuery = ''; },
        toggleFavorite(id) {
          const idx = this.favorites.indexOf(id); if(idx>-1) this.favorites.splice(idx,1); else this.favorites.push(id);
          localStorage.setItem('science_hub_favs', JSON.stringify(this.favorites));
        },
        
        openModal(type, data = null) { this.modal = { type, data }; history.pushState({modal: type}, ''); },
        closeModal() { this.modal = { type: null, data: null }; },

        goForm(app) {
          const isEdit = !!app; this.formError = ''; this.formShake = false;
          if (isEdit) { this.formData = { ...app }; } 
          else {
            const draft = localStorage.getItem('science_hub_draft');
            if (draft) { try { this.formData = JSON.parse(draft); } catch(e) {} } 
            else { this.formData = { category: this.lastCategory, unit: this.lastUnit, name: '', url: '', emoji: '🧪', tags: '', isHidden: false, isHot: false, openDate: '', order: 999 }; }
          }
          this.isCustomCat = isEdit ? !this.allCategories.includes(app.category) : false;
          this.isCustomUnit = isEdit ? !this.allUnits.includes(app.unit) : false;
          this.view = 'form'; history.pushState({view: 'form'}, '');
        },
        
        requestExitForm() { if (!this.formData.id) { this.openModal('confirmExit'); } else { this.goAdmin(); } },
        forceExitForm() { this.closeModal(); this.goAdmin(); },

        async submitForm() {
          if(!this.formData.name || !this.formData.url || !this.formData.emoji || !this.formData.category || !this.formData.unit) {
            this.formError = '필수 항목(이름, URL, 분류, 이모지)을 모두 입력하세요.'; this.formShake = true; setTimeout(() => this.formShake = false, 400);
            SoundFX.error(); Haptic.heavy(); return;
          }
          this.formError = '';
          const action = this.formData.id ? 'update' : 'create'; const payload = { ...this.formData };
          if(action === 'create') { payload.id = 'app_' + Date.now().toString(); payload.views = 0; payload.date = new Date().toISOString(); }
          payload.order = (payload.order === '' || payload.order == null) ? 999 : Number(payload.order);
          const success = await this.syncAppAction(action, payload);
          if(success) { 
            if(action === 'create') { this.lastCategory = payload.category; this.lastUnit = payload.unit; localStorage.removeItem('science_hub_draft'); }
            SoundFX.success(); this.showToast('성공적으로 저장되었습니다!', '🎉'); this.goAdmin(); 
          }
        },

        openAppUrl(app) {
          app.views = (app.views || 0) + 1; this.syncAppAction('incrementView', { id: app.id }); window.open(app.url, '_blank');
        },
        
        openQrModal(app) {
          this.openModal('qr', app);
          this.$nextTick(() => {
            const container = document.getElementById('qrcode'); container.innerHTML = '';
            new QRCode(container, { text: app.url, width: 512, height: 512, correctLevel: QRCode.CorrectLevel.L, colorDark: "#000000", colorLight: "#ffffff" });
          });
        },
        
        async copyText(e, textToCopy) {
          if (!textToCopy) return; const btn = e.currentTarget; const originalHTML = btn.innerHTML;
          try {
            if(navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(textToCopy); } else { throw new Error('Fallback needed'); }
          } catch(err) {
            const textArea = document.createElement("textarea"); textArea.value = textToCopy;
            textArea.style.position = "absolute"; textArea.style.left = "-999999px"; textArea.style.top = window.scrollY + "px"; 
            document.body.appendChild(textArea); textArea.focus(); textArea.select();
            try { document.execCommand('copy'); } catch(e2) { btn.innerHTML = `<span class="text-red-500 font-bold">복사 실패 ❌</span>`; SoundFX.error(); setTimeout(() => btn.innerHTML = originalHTML, 2000); return; }
            textArea.remove();
          }
          btn.innerHTML = `<span class="text-green-600 font-bold">복사 완료! ✅</span>`; SoundFX.success(); setTimeout(() => btn.innerHTML = originalHTML, 2000);
        }
      }));
    });
  </script>
</body>
</html>
