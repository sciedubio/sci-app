<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>과학 웹앱 허브</title>
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#2d3748">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🧪</text></svg>">
  
  <!-- Galmuri Font (Retro Pixel Art Style) -->
  <link href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css" rel="stylesheet">
  
  <!-- Required CDNs (Alpine.js & Tailwind CSS) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- Tailwind Config & Custom CSS -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { galmuri: ['Galmuri11', 'sans-serif'] },
          colors: {
            mc: { bg: '#8b8b8b', borderLight: '#ffffff', borderDark: '#373737', btn: '#c6c6c6', text: '#111111' }
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    body {
      font-family: 'Galmuri11', sans-serif;
      background-color: #2d3748;
      background-image: 
        linear-gradient(45deg, #1f2937 25%, transparent 25%, transparent 75%, #1f2937 75%, #1f2937),
        linear-gradient(45deg, #1f2937 25%, transparent 25%, transparent 75%, #1f2937 75%, #1f2937);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
      margin: 0;
      color: white;
      overflow-x: hidden;
      overscroll-behavior-y: none; /* Pull-to-refresh 방지 */
    }
    .h-screen-safe {
      height: 100dvh;
      height: calc(var(--vh, 1vh) * 100);
    }
    
    /* Retro Bevel Box CSS */
    .bevel-box {
      background-color: #c6c6c6;
      border: 4px solid;
      border-top-color: #ffffff;
      border-left-color: #ffffff;
      border-bottom-color: #373737;
      border-right-color: #373737;
      color: #111;
      image-rendering: pixelated;
    }
    .bevel-btn {
      background-color: #c6c6c6;
      border: 4px solid;
      border-top-color: #ffffff;
      border-left-color: #ffffff;
      border-bottom-color: #373737;
      border-right-color: #373737;
      color: #111;
      cursor: pointer;
      user-select: none;
    }
    .bevel-btn:active {
      border-top-color: #373737;
      border-left-color: #373737;
      border-bottom-color: #ffffff;
      border-right-color: #ffffff;
      padding-top: 2px;
      padding-left: 2px;
    }
    .bevel-inset {
      background-color: #8b8b8b;
      border: 4px solid;
      border-top-color: #373737;
      border-left-color: #373737;
      border-bottom-color: #ffffff;
      border-right-color: #ffffff;
    }
    
    .scrollable-panel { touch-action: pan-y; }
    ::-webkit-scrollbar { width: 12px; height: 12px; }
    ::-webkit-scrollbar-track { background: #8b8b8b; border-left: 2px solid #373737; }
    ::-webkit-scrollbar-thumb { background: #c6c6c6; border: 2px solid #ffffff; border-bottom-color: #373737; border-right-color: #373737; }
    
    [x-cloak] { display: none !important; }
  </style>
</head>
<body x-data="appData()" class="text-base" x-cloak>
  <div class="h-screen-safe flex flex-col relative w-full overflow-hidden bg-mc-bg">
    
    <!-- Sidebar Overlay & Panel -->
    <template x-if="isSidebarOpen">
      <div class="fixed inset-0 bg-black/60 z-[60] transition-opacity" @click="isSidebarOpen = false"></div>
    </template>
    
    <div class="fixed inset-y-0 left-0 w-64 bg-[#c6c6c6] border-r-4 border-[#111] z-[70] transform transition-transform duration-300 flex flex-col"
         :class="isSidebarOpen ? 'translate-x-0' : '-translate-x-full'">
      <div class="p-4 bg-[#8b8b8b] border-b-4 border-[#111] flex justify-between items-center" style="padding-top: max(16px, var(--safe-top))">
        <h2 class="text-xl font-bold text-white drop-shadow-md">메뉴 선택</h2>
        <button @click="isSidebarOpen = false" class="bevel-btn px-2 py-1 bg-red-400 text-white font-bold min-h-[44px]">X</button>
      </div>
      <div class="flex-1 overflow-y-auto p-4 flex flex-col gap-3 scrollable-panel">
        <template x-for="cat in allCategories" :key="cat">
          <button @click="selectCategory(cat)"
                  class="py-3 px-4 font-bold text-left text-lg min-h-[44px]"
                  :class="!showFavoritesOnly && selectedCategory === cat ? 'bevel-inset bg-blue-300 text-black' : 'bevel-btn'">
            <span x-text="cat"></span>
          </button>
        </template>
      </div>
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-[#2d3748] border-b-4 border-[#111] p-4 flex justify-between items-center" style="padding-top: max(16px, var(--safe-top))">
      <div class="flex items-center gap-3">
        <button @click="isSidebarOpen = true" class="bevel-btn p-2 flex flex-col gap-1 bg-[#c6c6c6] min-h-[44px] justify-center">
          <div class="w-5 h-1 bg-black"></div>
          <div class="w-5 h-1 bg-black"></div>
          <div class="w-5 h-1 bg-black"></div>
        </button>
        <h1 class="text-xl min-[480px]:text-2xl font-bold text-white flex items-center gap-2 drop-shadow-[2px_2px_0px_rgba(0,0,0,1)] whitespace-nowrap">
          <span class="text-3xl">🧪</span> 과학 허브
        </h1>
      </div>
      <div class="flex gap-2 relative">
        <button @click="openModal('guide')" class="bevel-btn px-2 py-1 text-sm font-bold flex items-center min-h-[44px]">⚙️</button>
        <template x-if="view === 'main'">
          <button @click="openModal('password')" class="bevel-btn px-2 py-1 text-sm font-bold flex items-center min-h-[44px]">🔒 관리</button>
        </template>
        <template x-if="view === 'admin'">
          <button @click="navigate('main')" class="bevel-btn px-2 py-1 text-sm font-bold flex items-center bg-yellow-400 min-h-[44px]">🏠 홈</button>
        </template>
      </div>
    </header>

    <!-- Content Wrapper -->
    <div class="flex-1 overflow-y-auto relative z-10 w-full scrollable-panel">
      
      <!-- Student View -->
      <main x-show="view === 'main'" class="p-4 flex flex-col gap-4 h-full max-w-6xl mx-auto pb-24">
        
        <!-- Search & Control Panel -->
        <div class="flex flex-col gap-3 mb-2 border-b-2 border-white/20 pb-4">
          <div class="flex justify-between items-center flex-wrap gap-2">
            <span class="text-xl font-bold text-yellow-300 drop-shadow-md" x-text="showFavoritesOnly ? '⭐ 내 즐겨찾기' : '📂 ' + selectedCategory"></span>
            <button @click="toggleFavoritesMode()" 
                    class="px-3 py-1 text-sm font-bold transition-colors min-h-[44px]"
                    :class="showFavoritesOnly ? 'bevel-box bg-yellow-400' : 'bevel-btn bg-[#c6c6c6] text-black'">
              <span x-text="showFavoritesOnly ? '전체 보기로 돌아가기' : '⭐ 즐겨찾기 모아보기'"></span>
            </button>
          </div>
          <input type="text" x-model="searchQuery" placeholder="🔍 앱 이름, 단원, #태그 검색..." 
                 class="bevel-inset p-3 w-full text-black bg-[#e5e5e5] focus:outline-none focus:bg-white focus:ring-2 focus:ring-yellow-400 min-h-[44px]">
        </div>

        <!-- Unit Tabs -->
        <template x-if="!showFavoritesOnly && !searchQuery">
          <div class="flex flex-wrap gap-2 mb-4">
            <template x-for="unit in studentAvailableUnits" :key="unit">
              <button @click="selectedUnit = unit"
                      class="px-3 py-1 text-sm font-bold min-h-[44px]"
                      :class="selectedUnit === unit ? 'bevel-box bg-yellow-400' : 'bevel-btn'"
                      x-text="unit"></button>
            </template>
          </div>
        </template>

        <!-- Cards Grid (1 col mobile, 2 col tablet, 3 col PC) -->
        <div class="grid grid-cols-1 min-[500px]:grid-cols-2 lg:grid-cols-3 gap-6">
          <template x-for="app in displayedApps" :key="app.id">
            <div class="bevel-box p-4 flex flex-col h-full bg-[#c6c6c6] hover:-translate-y-1 transition-transform relative">
              
              <button @click="toggleFavorite(app.id)" 
                      class="absolute top-4 right-4 text-3xl drop-shadow-md transition-transform hover:scale-110 active:scale-90 z-10"
                      title="즐겨찾기">
                <span x-text="favorites.includes(app.id) ? '⭐' : '☆'"></span>
              </button>

              <div class="flex justify-between items-start mb-2 pr-10">
                <div class="flex items-center gap-3">
                  <div class="text-4xl p-2 bevel-inset bg-[#e5e5e5] drop-shadow-md relative">
                    <span x-text="app.emoji"></span>
                    <template x-if="isAppHot(app)">
                      <span class="absolute -top-3 -right-3 bg-red-500 text-white text-[10px] px-1 py-0.5 font-bold border-2 border-white rounded-md transform rotate-12 drop-shadow-sm">HOT</span>
                    </template>
                  </div>
                  <div>
                    <span class="text-xs bg-gray-700 text-white px-2 py-1 inline-block mb-1 font-bold" x-text="app.category + ' > ' + app.unit"></span>
                    <h3 class="font-bold text-lg leading-tight break-keep text-black" x-text="app.name"></h3>
                  </div>
                </div>
              </div>
              
              <!-- Hashtags -->
              <template x-if="app.tags">
                <div class="flex flex-wrap gap-1 my-2">
                  <template x-for="tag in app.tags.split(',').map(t=>t.trim()).filter(Boolean)" :key="tag">
                    <span @click="searchQuery = tag; showFavoritesOnly = false;" class="text-xs bg-blue-100 text-blue-800 px-2 py-1 border-2 border-blue-400 font-bold cursor-pointer hover:bg-blue-200">#<span x-text="tag"></span></span>
                  </template>
                </div>
              </template>
              
              <div class="mt-auto pt-4 flex gap-2">
                <button @click="openModal('qr', app)" class="bevel-btn px-4 py-2 text-2xl bg-[#e5e5e5] min-h-[44px]">📱</button>
                <button @click="openApp(app)" class="bevel-btn flex-1 py-2 text-lg font-bold flex justify-center items-center gap-2 bg-green-400 hover:bg-green-300 min-h-[44px]">▶ OPEN</button>
              </div>
            </div>
          </template>
          
          <template x-if="displayedApps.length === 0">
            <div class="col-span-full bevel-inset p-8 text-center text-white font-bold text-xl">
              <span x-text="searchQuery ? '검색 결과가 없습니다. 🪹' : '등록된 웹앱이 없습니다. 🪹'"></span>
            </div>
          </template>
        </div>
      </main>

      <!-- Admin View -->
      <main x-show="view === 'admin'" class="p-4 flex flex-col gap-4 h-full pb-24 max-w-6xl mx-auto">
        <div class="flex justify-between items-end mb-4 flex-wrap gap-4">
          <h2 class="text-2xl font-bold flex items-center gap-2 drop-shadow-[2px_2px_0px_rgba(0,0,0,1)] text-white">
            <span class="text-3xl">🛠️</span> 관리자 패널
          </h2>
          <button @click="openModal('appForm', null)" class="bevel-btn bg-blue-400 px-6 py-2 font-bold flex items-center gap-2 min-h-[44px]">
            ➕ 새 웹앱 추가
          </button>
        </div>

        <div class="flex flex-wrap gap-3 mb-2 p-3 bg-[#c6c6c6] bevel-inset items-center">
          <span class="font-bold text-sm text-black mr-2">🔍 필터:</span>
          <select class="bevel-btn bg-[#e5e5e5] p-2 text-sm font-bold min-h-[44px] text-black" x-model="adminCategoryFilter" @change="adminUnitFilter = '전체'">
            <option value="전체">모든 대분류 보기</option>
            <template x-for="c in allCategories" :key="c"><option :value="c" x-text="c"></option></template>
          </select>
          <select class="bevel-btn bg-[#e5e5e5] p-2 text-sm font-bold min-h-[44px] text-black" x-model="adminUnitFilter">
            <template x-for="u in adminAvailableUnits" :key="u">
              <option :value="u" x-text="u === '전체' ? '모든 소분류 보기' : u"></option>
            </template>
          </select>
          <div class="ml-auto text-xs font-bold bg-[#373737] text-white px-3 py-2 border-2 border-[#ffffff] border-b-[#111111] border-r-[#111111]">
            총 <span x-text="adminDisplayedApps.length"></span>개
          </div>
        </div>

        <div class="bevel-box overflow-x-auto bg-[#c6c6c6] p-2">
          <table class="w-full text-sm text-left min-w-[900px] text-black">
            <thead class="bg-[#8b8b8b] text-white">
              <tr>
                <th class="p-3 border-2 border-[#373737]">상태/조회</th>
                <th class="p-3 border-2 border-[#373737]">대분류/소분류</th>
                <th class="p-3 border-2 border-[#373737] text-center">아이콘</th>
                <th class="p-3 border-2 border-[#373737]">앱 정보 (태그/예약)</th>
                <th class="p-3 border-2 border-[#373737]">관리</th>
              </tr>
            </thead>
            <tbody class="bg-[#e5e5e5]">
              <template x-for="app in adminDisplayedApps" :key="app.id">
                <tr class="border-b-2 border-[#c6c6c6] hover:bg-[#d4d4d4] transition-colors" :class="app.isHidden ? 'opacity-60 bg-[#c6c6c6]' : ''">
                  <td class="p-3 border-2 border-[#373737] font-bold text-center space-y-1">
                    <template x-if="app.isHidden"><span class="block text-xs bg-gray-600 text-white px-1">비공개</span></template>
                    <template x-if="!app.isHidden"><span class="block text-xs bg-green-600 text-white px-1">공개됨</span></template>
                    <template x-if="app.isHot"><span class="block text-xs bg-red-500 text-white px-1 mt-1">고정HOT</span></template>
                    <template x-if="app.publishDate && new Date(app.publishDate) > new Date()"><span class="block text-xs bg-purple-500 text-white px-1 mt-1">⏳ 예약됨</span></template>
                    <div class="text-xs mt-1 text-gray-700">조회: <span x-text="app.clicks || 0"></span></div>
                  </td>
                  <td class="p-3 border-2 border-[#373737] font-bold text-blue-800">
                    <div x-text="app.category"></div>
                    <div class="text-xs text-gray-700 font-normal" x-text="app.unit"></div>
                  </td>
                  <td class="p-3 border-2 border-[#373737] text-2xl text-center" x-text="app.emoji"></td>
                  <td class="p-3 border-2 border-[#373737] font-bold">
                    <div x-text="app.name"></div>
                    <div class="text-xs font-normal text-blue-600 mt-1 truncate max-w-[250px]" x-text="app.url"></div>
                    <template x-if="app.tags"><div class="text-[10px] text-gray-600 mt-1">#<span x-text="app.tags"></span></div></template>
                  </td>
                  <td class="p-3 border-2 border-[#373737]">
                    <div class="flex gap-2">
                      <button @click="openModal('appForm', app)" class="bevel-btn px-2 py-1 bg-yellow-300 text-xs font-bold min-h-[36px]">수정</button>
                      <button @click="openModal('confirmDelete', app)" class="bevel-btn px-2 py-1 bg-red-400 text-xs font-bold text-white min-h-[36px]">삭제</button>
                    </div>
                  </td>
                </tr>
              </template>
              <template x-if="adminDisplayedApps.length === 0">
                <tr><td colspan="5" class="p-4 text-center font-bold">등록된 앱이 없습니다.</td></tr>
              </template>
            </tbody>
          </table>
        </div>
      </main>
    </div> <!-- End Content Wrapper -->

    <!-- Footer -->
    <footer class="text-center p-2 bg-[#2d3748] border-t-4 border-[#111] z-40 text-xs font-bold text-white" style="padding-bottom: max(8px, var(--safe-bottom))">
      Created by Yang DH
    </footer>

    <!-- Loading Overlay -->
    <template x-if="loading">
      <div class="fixed inset-0 z-[200] bg-black/70 flex flex-col items-center justify-center backdrop-blur-sm">
        <div class="text-6xl animate-bounce drop-shadow-[0_0_10px_rgba(255,255,255,0.8)]">⛏️</div>
        <div class="mt-4 text-white font-bold text-xl tracking-widest animate-pulse">데이터 채굴 중...</div>
      </div>
    </template>

    <!-- Modals Overlay System -->
    <template x-if="modal.type">
      <div class="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4" style="padding-bottom: max(16px, var(--safe-bottom))" @click="closeModal()">
        <div class="bevel-box w-full max-w-md max-h-[90dvh] overflow-y-auto scrollable-panel p-6 flex flex-col bg-[#c6c6c6]" @click.stop>
          
          <!-- Password Modal -->
          <template x-if="modal.type === 'password'">
            <div>
              <h3 class="text-xl font-bold mb-4 text-black">관리자 인증</h3>
              <p class="mb-4 text-sm text-gray-700">비밀번호를 입력하세요.</p>
              <input type="password" x-model="adminPwInput" @keyup.enter="verifyPassword()" class="bevel-inset w-full p-3 mb-6 text-black bg-[#e5e5e5] focus:outline-none focus:bg-white" autofocus>
              <div class="flex justify-end gap-2 mt-auto">
                <button @click="closeModal()" class="bevel-btn px-4 py-2 bg-gray-400 min-h-[44px]">취소</button>
                <button @click="verifyPassword()" class="bevel-btn px-4 py-2 bg-blue-400 font-bold min-h-[44px]">확인</button>
              </div>
            </div>
          </template>

          <!-- Alert Modal -->
          <template x-if="modal.type === 'alert'">
            <div>
              <h3 class="text-xl font-bold mb-4 text-red-600">알림</h3>
              <p class="mb-6 text-black" x-text="modal.data"></p>
              <div class="flex justify-end mt-auto">
                <button @click="closeModal()" class="bevel-btn px-6 py-2 bg-blue-400 font-bold min-h-[44px]">확인</button>
              </div>
            </div>
          </template>

          <!-- Confirm Delete Modal -->
          <template x-if="modal.type === 'confirmDelete'">
            <div>
              <h3 class="text-xl font-bold mb-4 text-red-600">삭제 확인</h3>
              <p class="mb-6 break-keep text-black">정말 <b x-text="'[' + modal.data.name + ']'"></b> 웹앱을 삭제하시겠습니까?</p>
              <div class="flex justify-end gap-2 mt-auto">
                <button @click="closeModal()" class="bevel-btn px-4 py-2 bg-gray-400 min-h-[44px]">취소</button>
                <button @click="executeDelete()" class="bevel-btn px-4 py-2 bg-red-400 font-bold text-white min-h-[44px]">삭제하기</button>
              </div>
            </div>
          </template>

          <!-- QR Modal -->
          <template x-if="modal.type === 'qr'">
            <div class="flex flex-col items-center">
              <h3 class="text-2xl font-bold mb-2 text-black" x-text="modal.data.name"></h3>
              <p class="mb-6 text-sm text-gray-700 bg-gray-200 p-2 break-all w-full text-center" x-text="modal.data.url"></p>
              <!-- 200x200 QR 배경은 흰색이어야 스캔이 잘 됨 -->
              <div class="bg-[#ffffff] p-4 bevel-inset mb-6 w-[240px] h-[240px] flex items-center justify-center">
                <div id="qrcode-container"></div>
              </div>
              <button @click="closeModal()" class="bevel-btn w-full py-3 bg-red-400 font-bold text-lg min-h-[44px]">닫기</button>
            </div>
          </template>

          <!-- Form Modal (Add/Edit) -->
          <template x-if="modal.type === 'appForm'">
            <div class="flex flex-col h-full text-black">
              <!-- 에러 1번 수정: formData.id 를 참조하여 null 접근 원천 차단 -->
              <h3 class="text-xl font-bold mb-4" x-text="formData.id ? '웹앱 수정' : '새 웹앱 추가'"></h3>
              <div class="text-xs bg-yellow-100 text-yellow-800 p-1 mb-2 border-2 border-yellow-400 font-bold">💡 폼 입력 시 자동 임시저장 됩니다.</div>
              
              <label class="text-sm font-bold mb-1">대분류 (사이드바 메뉴)</label>
              <!-- 에러 2번 수정: x-model.debounce 제거 후 @change 와 @input 으로 분리 매핑 -->
              <select class="bevel-inset p-2 w-full text-black bg-[#e5e5e5] focus:bg-white mb-2 min-h-[44px]" 
                      x-model="formData.categoryPreset" 
                      @change="formData.categoryPreset === 'custom' ? formData.category = '' : formData.category = formData.categoryPreset; saveDraft();">
                <template x-for="c in allCategories" :key="c"><option :value="c" x-text="c"></option></template>
                <option value="custom">➕ 직접 입력</option>
              </select>
              <template x-if="formData.categoryPreset === 'custom'">
                <input type="text" x-model="formData.category" @input="saveDraft()" class="bevel-inset p-2 mb-4 w-full text-black bg-[#e5e5e5] focus:outline-none focus:bg-white focus:ring-2" placeholder="새 대분류">
              </template>

              <label class="text-sm font-bold mb-1">소분류 (단원)</label>
              <select class="bevel-inset p-2 w-full text-black bg-[#e5e5e5] focus:bg-white mb-2 min-h-[44px]"
                      x-model="formData.unitPreset"
                      @change="formData.unitPreset === 'custom' ? formData.unit = '' : formData.unit = formData.unitPreset; saveDraft();">

                  <span class="font-bold drop-shadow-md">🔥 고정 HOT (조회수 무관하게 항상 배지 표시)</span>

                <p class="text-red-600 text-sm font-bold mb-4 animate-bounce" x-text="formErrorMsg"></p>

              <div class="flex justify-end gap-2 mt-auto pt-4">
                <button @click="closeModal()" class="bevel-btn px-4 py-2 bg-gray-400 min-h-[44px]">취소</button>
                <button @click="executeSaveForm()" class="bevel-btn px-4 py-2 bg-blue-400 font-bold min-h-[44px]">저장</button>
              </div>
            </div>
          </template>

          <!-- Guide Modal -->
          <template x-if="modal.type === 'guide'">
            <div class="flex flex-col h-full">
              <h3 class="text-xl font-bold mb-4 flex items-center gap-2 text-black">⚙️ DB 연동 가이드</h3>
              <div class="bg-[#1e1e1e] text-[#d4d4d4] p-4 font-mono text-xs overflow-auto h-64 bevel-inset mb-4 text-left whitespace-pre break-all select-all scrollable-panel" x-text="gasCodeText"></div>
              <div class="text-sm space-y-2 mb-4 font-bold text-gray-800">
                <p class="text-red-600 bg-red-100 p-1 border-2 border-red-500">🚨 앱스 스크립트에 위 코드를 덮어쓰고 <b>반드시 "새 배포"</b>를 해주세요!</p>
                <p>※ GET(비밀번호 검증)과 POST(데이터저장/조회수)가 분리되어 완벽하게 동작합니다.</p>
                <p>※ Settings 시트 자동 생성 및 동적 헤더가 적용되어 있습니다.</p>
              </div>
              <div class="flex justify-between mt-auto gap-2">
                <!-- 에러 4번 수정: Fallback Copy 함수 개선 -->
                <button @click="copyGasCode($event)" class="bevel-btn px-2 py-2 bg-green-400 font-bold min-h-[44px] flex-1 text-sm">📄 코드 복사하기</button>
                <button @click="closeModal()" class="bevel-btn px-4 py-2 bg-red-400 font-bold text-white min-h-[44px]">닫기</button>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>
  </div>

  <script>
    // Set vh for iOS Safari Safe Area
    const setVH = () => document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
    window.addEventListener('resize', setVH);
    setVH();

    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz4uM1Wo-B4ZZr6UHkRf3PuPG0gUyN8BByOkIlH7jcTBxyi6j7ewnooSjyufvxuk5A/exec";
    const DEFAULT_CATEGORIES = ['중1 과학', '중2 과학', '중3 과학', '수업 영상', '공지/정보'];
    const DEFAULT_UNITS = ['1단원', '2단원', '3단원', '4단원', '5단원', '6단원', '7단원', '8단원'];
    const DUMMY_DATA = [
      { id: 'd1', category: '중2 과학', unit: '1단원', name: '원소 불꽃반응 실험', url: 'https://example.com', emoji: '🔥', isHidden: false, isHot: true, clicks: 150, tags: '실험,가상현실' },
      { id: 'd2', category: '중2 과학', unit: '2단원', name: '전자기 유도 발전기', url: 'https://example.com', emoji: '⚡', isHidden: false, isHot: false, clicks: 42, tags: '물리' },
      { id: 'd3', category: '중3 과학', unit: '3단원', name: '태양계 행성 크기 비교', url: 'https://example.com', emoji: '🪐', isHidden: false, isHot: false, clicks: 89, tags: '지구과학,우주' },
    ];

    const naturalSort = (a, b) => new Intl.Collator('ko', { numeric: true, sensitivity: 'base' }).compare(a, b);

    document.addEventListener('alpine:init', () => {
      Alpine.data('appData', () => ({
        view: 'main',
        apps: [],
        loading: false,
        
        isSidebarOpen: false,
        selectedCategory: '중2 과학',
        selectedUnit: '전체',
        
        searchQuery: '',
        favorites: JSON.parse(localStorage.getItem('science_hub_favs') || '[]'),
        showFavoritesOnly: false,

        adminPw: '',
        adminPwInput: '',
        modal: { type: null, data: null },
        
        adminCategoryFilter: '전체',
        adminUnitFilter: '전체',

        formErrorMsg: '',
        formData: { id: null, categoryPreset: '중2 과학', category: '중2 과학', unitPreset: '1단원', unit: '1단원', emoji: '🧪', name: '', url: '', tags: '', publishDate: '', isHot: false, isHidden: false },

        gasCodeText: `function doGet(e) {
  try {
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    if (!ss) throw new Error("스프레드시트를 찾을 수 없습니다. 반드시 구글 시트 메뉴의 [확장 프로그램 > Apps Script]에서 스크립트를 만드세요.");
    
    var settingsSheet = ss.getSheetByName('Settings');
    if(!settingsSheet) {
      settingsSheet = ss.insertSheet('Settings');
      settingsSheet.appendRow(['관리자 비밀번호', 'science123']);
      settingsSheet.getRange(1, 1, 1, 2).setFontWeight('bold').setBackground('#f4cccc');
    }
    var actualPassword = settingsSheet.getRange(1, 2).getValue().toString();
    
    var action = (e && e.parameter) ? e.parameter.action : null;
    if(action === 'verify') {
      var inputPw = e.parameter.password || '';
      var result = (inputPw === actualPassword) ? 'success' : 'error';
      return ContentService.createTextOutput(JSON.stringify({result: result})).setMimeType(ContentService.MimeType.JSON);
    }
    
    var sheet = ss.getSheetByName('Apps');
    if(!sheet) return ContentService.createTextOutput(JSON.stringify([])).setMimeType(ContentService.MimeType.JSON);
    var data = sheet.getDataRange().getValues();
    if(data.length < 2) return ContentService.createTextOutput(JSON.stringify([])).setMimeType(ContentService.MimeType.JSON);
    var headers = data[0];
    var resultArr = [];
    for(var i=1; i<data.length; i++) {
      var obj = {};
      for(var j=0; j<headers.length; j++) obj[headers[j]] = data[i][j];
      resultArr.push(obj);
    }
    return ContentService.createTextOutput(JSON.stringify(resultArr)).setMimeType(ContentService.MimeType.JSON);
  } catch (error) {
    return ContentService.createTextOutput(JSON.stringify({error: true, message: error.toString()})).setMimeType(ContentService.MimeType.JSON);
  }
}

function doPost(e) {
  try {
    if (!e || !e.postData) throw new Error("웹 요청이 아닙니다. 스크립트 편집기에서 '실행' 버튼을 누르지 마세요.");
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var sheet = ss.getSheetByName('Apps');
    if(!sheet) {
      sheet = ss.insertSheet('Apps');
      sheet.appendRow(['id', 'category', 'unit', 'name', 'url', 'emoji', 'isHidden', 'isHot', 'date', 'clicks', 'tags', 'publishDate']);
      sheet.getRange(1, 1, 1, 12).setFontWeight('bold').setBackground('#4a86e8').setFontColor('#ffffff');
    }
    
    var req = JSON.parse(e.postData.contents);
    var action = req.action;
    var data = req.data;
    
    // 동적 헤더 생성 로직
    var headers = sheet.getRange(1, 1, 1, sheet.getLastColumn()).getValues()[0];
    
    if (action === 'click') {
      var sheetData = sheet.getDataRange().getValues();
      for(var i=1; i<sheetData.length; i++) {
        if(sheetData[i][0] === data.id) {
          var clickCol = headers.indexOf('clicks') + 1;
          if(clickCol > 0) {
            var currentClicks = sheet.getRange(i+1, clickCol).getValue() || 0;
            sheet.getRange(i+1, clickCol).setValue(currentClicks + 1);
          }
          break;
        }
      }
    } else if (action === 'create') {
      var newRow = [];
      for(var j=0; j<headers.length; j++) {
        var key = headers[j];
        if(key === 'id') newRow.push(Utilities.getUuid());
        else if(key === 'date') newRow.push(new Date().toISOString());
        else if(key === 'clicks') newRow.push(0);
        else newRow.push(data[key] !== undefined ? data[key] : '');
      }
      sheet.appendRow(newRow);
    } else if (action === 'update' || action === 'delete') {
      var sheetData = sheet.getDataRange().getValues();
      for(var i=1; i<sheetData.length; i++) {
        if(sheetData[i][0] === data.id) {
          if(action === 'delete') sheet.deleteRow(i+1);
          else {
            for(var j=0; j<headers.length; j++) {
              var key = headers[j];
              if(key !== 'id' && key !== 'date' && key !== 'clicks' && data[key] !== undefined) {
                sheet.getRange(i+1, j+1).setValue(data[key]);
              }
            }
          }
          break;
        }
      }
    }
    return ContentService.createTextOutput(JSON.stringify({ result: 'success' })).setMimeType(ContentService.MimeType.JSON);
  } catch(error) {
    return ContentService.createTextOutput(JSON.stringify({ result: 'error', message: error.toString() })).setMimeType(ContentService.MimeType.JSON);
  }
}`,

        init() {
          window.history.replaceState({ view: 'main' }, '');
          window.addEventListener('popstate', (e) => {
            const v = e.state?.view;
            if (['main', 'admin'].includes(v)) {
              this.view = v;
              if (this.modal.type) this.closeModal();
            }
          });
          this.fetchApps();
        },

        navigate(nextView) {
          this.view = nextView;
          window.history.pushState({ view: nextView }, '');
          this.searchQuery = '';
          this.showFavoritesOnly = false;
        },

        get allCategories() {
          const current = this.apps.map(a => a.category).filter(Boolean);
          return Array.from(new Set([...DEFAULT_CATEGORIES, ...current])).sort(naturalSort);
        },

        get allUnits() {
          const current = this.apps.map(a => a.unit).filter(Boolean);
          return Array.from(new Set([...DEFAULT_UNITS, ...current])).sort(naturalSort);
        },

        get studentAvailableUnits() {
          const inCat = this.apps.filter(a => a.category === this.selectedCategory && !a.isHidden).map(a => a.unit);
          return ['전체', ...Array.from(new Set(inCat)).sort(naturalSort)];
        },

        get adminAvailableUnits() {
          if (this.adminCategoryFilter === '전체') return ['전체', ...this.allUnits];
          const inCat = this.apps.filter(a => a.category === this.adminCategoryFilter).map(a => a.unit);
          return ['전체', ...Array.from(new Set(inCat)).sort(naturalSort)];
        },

        get displayedApps() {
          let filtered = this.apps.filter(app => {
            if (app.isHidden) return false;
            if (app.publishDate && new Date(app.publishDate) > new Date()) return false;
            return true;
          });

          // Compute Hot status (Top 3 by clicks + fixed hot)
          const sortedByClicks = [...filtered].sort((a, b) => (b.clicks || 0) - (a.clicks || 0));
          const top3Ids = sortedByClicks.slice(0, 3).map(a => a.id);
          filtered.forEach(app => {
            app._dynamicHot = app.isHot || top3Ids.includes(app.id);
          });

          if (this.searchQuery.trim() !== '') {
            const q = this.searchQuery.toLowerCase();
            return filtered.filter(app => 
              app.name.toLowerCase().includes(q) || 
              app.category.toLowerCase().includes(q) || 
              app.unit.toLowerCase().includes(q) ||
              (app.tags && app.tags.toLowerCase().includes(q))
            );
          }

          if (this.showFavoritesOnly) {
            return filtered.filter(app => this.favorites.includes(app.id));
          }

          filtered = filtered.filter(app => app.category === this.selectedCategory);
          if (this.selectedUnit !== '전체') {
            filtered = filtered.filter(app => app.unit === this.selectedUnit);
          }
          return filtered;
        },

        get adminDisplayedApps() {
          let filtered = this.apps;
          if (this.adminCategoryFilter !== '전체') filtered = filtered.filter(a => a.category === this.adminCategoryFilter);
          if (this.adminUnitFilter !== '전체') filtered = filtered.filter(a => a.unit === this.adminUnitFilter);
          return filtered;
        },

        selectCategory(cat) {
          this.selectedCategory = cat;
          this.selectedUnit = '전체';
          this.showFavoritesOnly = false;
          this.searchQuery = '';
          this.isSidebarOpen = false;
        },

        toggleFavoritesMode() {
          this.showFavoritesOnly = !this.showFavoritesOnly;
          if(this.showFavoritesOnly) this.searchQuery = '';
        },

        toggleFavorite(id) {
          if (this.favorites.includes(id)) this.favorites = this.favorites.filter(f => f !== id);
          else this.favorites.push(id);
          localStorage.setItem('science_hub_favs', JSON.stringify(this.favorites));
        },

        isAppHot(app) {
          return app._dynamicHot;
        },

        async fetchApps() {
          if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.trim() === '') { this.apps = DUMMY_DATA; return; }
          
          if (GOOGLE_SCRIPT_URL.includes('/dev')) {
            setTimeout(() => this.openModal('alert', '⚠️ 현재 입력된 주소는 /dev 로 끝나는 테스트 주소입니다. 구글 시트에서 반드시 "새 배포"를 누르고 /exec 로 끝나는 주소를 넣어주세요.'), 500);
            this.apps = DUMMY_DATA;
            return;
          }

          this.loading = true;
          try {
            const res = await Promise.race([
              fetch(GOOGLE_SCRIPT_URL.trim()),
              new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 8000))
            ]);
            const data = await res.json();
            
            // 추가된 에러 핸들링: GAS 스크립트 내부에서 에러가 발생했을 경우
            if (data && data.error) {
              this.openModal('alert', '구글 시트 에러: ' + data.message);
              this.apps = DUMMY_DATA;
              return;
            }
            
            this.apps = Array.isArray(data) ? data.map(app => ({
              ...app,
              isHidden: app.isHidden === true || app.isHidden === 'true',
              isHot: app.isHot === true || app.isHot === 'true',
              clicks: parseInt(app.clicks) || 0
            })) : [];
          } catch(err) {
            console.error(err);
            this.openModal('alert', '통신 실패! 구글 시트 배포 시 "액세스 권한: 모든 사용자"로 설정되었는지 확인하세요.');
            this.apps = DUMMY_DATA;
          } finally {
            this.loading = false;
          }
        },

        async verifyPassword() {
          if (!this.adminPwInput) return;
          if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.trim() === '') {
            if (this.adminPwInput === 'science123') {
              this.adminPw = this.adminPwInput;
              this.closeModal();
              this.navigate('admin');
            } else {
              this.openModal('alert', '임시 로컬 모드 비밀번호는 science123 입니다.');
            }
            return;
          }
          
          if (GOOGLE_SCRIPT_URL.includes('/dev')) {
            this.openModal('alert', '⚠️ 에러: /dev 로 끝나는 테스트 주소입니다. 새 배포를 통한 /exec 주소를 넣어주세요.');
            return;
          }
          
          this.loading = true;
          try {
            let targetUrl = '';
            try {
              const urlObj = new URL(GOOGLE_SCRIPT_URL.trim());
              urlObj.searchParams.append('action', 'verify');
              urlObj.searchParams.append('password', this.adminPwInput);
              targetUrl = urlObj.toString();
            } catch(e) {
              targetUrl = `${GOOGLE_SCRIPT_URL.trim()}?action=verify&password=${encodeURIComponent(this.adminPwInput)}`;
            }

            const res = await fetch(targetUrl);
            const data = await res.json();
            if (data.result === 'success') {
              this.adminPw = this.adminPwInput;
              this.closeModal();
              this.navigate('admin');
            } else {
              this.openModal('alert', '비밀번호가 일치하지 않습니다.');
            }
          } catch (e) {
            console.error(e);
            this.openModal('alert', '서버 통신 실패! 구글 시트 배포 시 "액세스 권한: 모든 사용자"로 설정했는지 꼭 확인해주세요.');
          } finally {
            this.loading = false;
            this.adminPwInput = '';
          }
        },

        async openApp(app) {
          // 백그라운드로 클릭수 1 증가 전송 (no-cors)
          if (GOOGLE_SCRIPT_URL) {
            fetch(GOOGLE_SCRIPT_URL, {
              method: 'POST', mode: 'no-cors',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: 'click', data: { id: app.id } })
            }).catch(e => console.log('Click track failed'));
            
            // 로컬 상태 즉각 반영
            const idx = this.apps.findIndex(a => a.id === app.id);
            if(idx > -1) this.apps[idx].clicks = (this.apps[idx].clicks || 0) + 1;
          }
          window.open(app.url, '_blank');
        },

        async executeAction(action, data) {
          if (!GOOGLE_SCRIPT_URL) {
            if(action === 'create') this.apps.push({ ...data, id: Date.now().toString(), clicks: 0 });
            if(action === 'delete') this.apps = this.apps.filter(a => a.id !== data.id);
            if(action === 'update') this.apps = this.apps.map(a => a.id === data.id ? {...a, ...data} : a);
            return true;
          }

          this.loading = true;
          try {
            await Promise.race([
              fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST', mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action, data, password: this.adminPw })
              }),
              new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 8000))
            ]);
            await this.fetchApps();
            return true;
          } catch(err) {
            this.openModal('alert', '서버 통신 오류. 변경사항이 저장되지 않았을 수 있습니다.');
            return false;
          } finally {
            this.loading = false;
          }
        },

        openModal(type, data = null) {
          this.modal = { type, data };
          if (type === 'appForm') {
            if (data) {
              this.formData = {
                id: data.id,
                categoryPreset: this.allCategories.includes(data.category) ? data.category : 'custom',
                category: data.category,
                unitPreset: this.allUnits.includes(data.unit) ? data.unit : 'custom',
                unit: data.unit,
                emoji: data.emoji || '🧪',
                name: data.name || '',
                url: data.url || '',
                tags: data.tags || '',
                publishDate: data.publishDate || '',
                isHot: data.isHot || false,
                isHidden: data.isHidden || false
              };
            } else {
              const draft = localStorage.getItem('science_hub_draft');
              if (draft) {
                this.formData = JSON.parse(draft);
              } else {
                this.formData = { id: null, categoryPreset: '중2 과학', category: '중2 과학', unitPreset: '1단원', unit: '1단원', emoji: '🧪', name: '', url: '', tags: '', publishDate: '', isHot: false, isHidden: false };
              }
            }
            this.formErrorMsg = '';
          } else if (type === 'qr') {
            setTimeout(() => {
              const container = document.getElementById('qrcode-container');
              if(container) {
                container.innerHTML = '';
                new window.QRCode(container, {
                  text: data.url,
                  width: 200,
                  height: 200,
                  colorDark : "#000000",
                  colorLight : "#ffffff",
                  correctLevel : window.QRCode.CorrectLevel.M
                });
              }
            }, 50);
          }
          window.history.pushState({ view: this.view, modal: type }, '');
        },

        closeModal() {
          this.modal = { type: null, data: null };
          if(window.history.state?.modal) window.history.back();
        },

        saveDraft() {
          if (!this.formData.id) { // 새 앱일 때만 임시저장
            localStorage.setItem('science_hub_draft', JSON.stringify(this.formData));
          }
        },

        async executeSaveForm() {
          if(!this.formData.name || !this.formData.url || !this.formData.emoji || !this.formData.category || !this.formData.unit) {
            this.formErrorMsg = '모든 필수 필드를 빠짐없이 입력해주세요.';
            return;
          }
          const action = this.formData.id ? 'update' : 'create';
          const success = await this.executeAction(action, this.formData);
          if (success) {
            if(!this.formData.id) localStorage.removeItem('science_hub_draft');
            this.closeModal();
          }
        },

        async executeDelete() {
          const success = await this.executeAction('delete', { id: this.modal.data.id });
          if(success) this.closeModal();
        },

        async copyGasCode(e) {
          const btn = e.target; 
          const original = btn.innerText;
          let copySuccess = false;
          
          // 1. 최신 클립보드 API를 먼저 시도
          try {
            if(navigator.clipboard && window.isSecureContext) {
              await navigator.clipboard.writeText(this.gasCodeText);
              copySuccess = true;
            }
          } catch(err) {
            console.warn("최신 클립보드 API 차단됨(IFrame). 구형 Fallback 방식으로 우회합니다.", err);
          }

          // 2. 최신 API가 실패했거나 사용할 수 없을 경우 강제 복사(Fallback) 시도
          if (!copySuccess) {
            try {
              const textArea = document.createElement("textarea");
              textArea.value = this.gasCodeText;
              textArea.style.position = "fixed";
              textArea.style.top = "0";
              textArea.style.left = "0";
              textArea.style.opacity = "0";
              document.body.appendChild(textArea);
              textArea.focus();
              textArea.select();
              const successful = document.execCommand('copy');
              document.body.removeChild(textArea);
              if(!successful) throw new Error('Fallback execCommand failed');
              copySuccess = true;
            } catch(fallbackErr) {
              console.error("강제 복사(Fallback)까지 모두 실패했습니다:", fallbackErr);
            }
          }

          // 3. 최종 성공 여부에 따라 UI 업데이트
          if (copySuccess) {
            btn.innerText = '✅ 복사 완료!';
            btn.classList.replace('bg-green-400', 'bg-blue-400');
          } else {
            btn.innerText = '❌ 복사 실패 (수동으로 드래그해주세요)';
            btn.classList.replace('bg-green-400', 'bg-red-400');
          }
          
          setTimeout(() => {
            btn.innerText = original;
            btn.classList.remove('bg-blue-400', 'bg-red-400');
            btn.classList.add('bg-green-400');
          }, 3000);
        }
      }));
    });
  </script>
</body>
</html>
