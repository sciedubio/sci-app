<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 모바일 줌 방지 및 Safe Area 대응 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>과학 웹앱 허브</title>
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#2d3748">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🧪</text></svg>">
  
  <!-- Galmuri Font (Retro Pixel Art Style) -->
  <link href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css" rel="stylesheet">
  
  <!-- 필수 CDN (Alpine.js, Tailwind, QRCode) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- Tailwind Config & Custom CSS -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { galmuri: ['Galmuri11', 'sans-serif'] },
          colors: {
            mc: {
              bg: '#8b8b8b', borderLight: '#ffffff', borderDark: '#373737',
              btn: '#c6c6c6', btnHover: '#dfdfdf', btnActive: '#8b8b8b', text: '#111111'
            }
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    body {
      font-family: 'Galmuri11', sans-serif;
      background-color: #2d3748;
      background-image: 
        linear-gradient(45deg, #1f2937 25%, transparent 25%, transparent 75%, #1f2937 75%, #1f2937),
        linear-gradient(45deg, #1f2937 25%, transparent 25%, transparent 75%, #1f2937 75%, #1f2937);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
      margin: 0; color: white; overflow-x: hidden;
      /* 텍스트 드래그 차단 (원클릭 복사 버튼 등으로 우회) */
      -webkit-user-select: none; user-select: none;
    }
    /* iOS 줌 방지를 위해 입력 폼 폰트 크기 강제 16px */
    input, textarea, select { user-select: auto; font-size: 16px !important; } 
    
    .h-screen-safe { height: 100dvh; height: calc(var(--vh, 1vh) * 100); }
    
    /* Retro Bevel Box CSS (입체 버튼 및 박스) */
    .bevel-box { background-color: #c6c6c6; border: 4px solid; border-top-color: #ffffff; border-left-color: #ffffff; border-bottom-color: #373737; border-right-color: #373737; color: #111; image-rendering: pixelated; }
    .bevel-btn { background-color: #c6c6c6; border: 4px solid; border-top-color: #ffffff; border-left-color: #ffffff; border-bottom-color: #373737; border-right-color: #373737; color: #111; cursor: pointer; transition: transform 0.1s; }
    .bevel-btn:active { border-top-color: #373737; border-left-color: #373737; border-bottom-color: #ffffff; border-right-color: #ffffff; padding-top: 2px; padding-left: 2px; transform: scale(0.98); }
    .bevel-inset { background-color: #e5e5e5; border: 4px solid; border-top-color: #373737; border-left-color: #373737; border-bottom-color: #ffffff; border-right-color: #ffffff; color: #111; }
    .bevel-inset-dark { background-color: #8b8b8b; border: 4px solid; border-top-color: #373737; border-left-color: #373737; border-bottom-color: #ffffff; border-right-color: #ffffff; color: white; }
    
    /* QR Code 완벽 렌더링 강제 (찌그러짐 방지 - !important 적용) */
    #qrcode img, #qrcode canvas { max-width: none !important; width: 200px !important; height: 200px !important; image-rendering: pixelated; margin: 0 auto; }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 12px; height: 12px; }
    ::-webkit-scrollbar-track { background: #8b8b8b; border-left: 2px solid #373737; }
    ::-webkit-scrollbar-thumb { background: #c6c6c6; border: 2px solid #ffffff; border-bottom-color: #373737; border-right-color: #373737; }
  </style>
</head>
<body x-data="appData">
  <div class="h-screen-safe flex flex-col relative w-full overflow-hidden bg-mc-bg">
    
    <!-- 사이드바 오버레이 -->
    <template x-if="isSidebarOpen">
      <div class="fixed inset-0 bg-black/60 z-50 transition-opacity" @click="isSidebarOpen = false"></div>
    </template>
    <div class="fixed inset-y-0 left-0 w-64 bg-[#c6c6c6] border-r-4 border-[#111] z-[60] transform transition-transform duration-300 flex flex-col"
         :class="isSidebarOpen ? 'translate-x-0' : '-translate-x-full'">
      <div class="p-4 bg-[#8b8b8b] border-b-4 border-[#111] flex justify-between items-center" style="padding-top: max(16px, var(--safe-top))">
        <h2 class="text-xl font-bold text-white drop-shadow-md">메뉴 선택</h2>
        <button @click="isSidebarOpen = false" class="bevel-btn px-2 py-1 bg-red-400 text-white font-bold">X</button>
      </div>
      <div class="flex-1 overflow-y-auto p-4 flex flex-col gap-3 scrollable-panel">
        <template x-for="cat in allCategories" :key="cat">
          <button @click="selectCategory(cat)"
                  class="py-3 px-4 font-bold text-left text-lg transition-colors"
                  :class="(!showFavoritesOnly && selectedCategory === cat) ? 'bevel-inset bg-blue-300 text-black' : 'bevel-btn'">
            <span x-text="cat"></span>
          </button>
        </template>
      </div>
    </div>

    <header class="sticky top-0 z-40 bg-[#2d3748] border-b-4 border-[#111] p-4 flex justify-between items-center" style="padding-top: max(16px, var(--safe-top))">
      <div class="flex items-center gap-3">
        <button @click="isSidebarOpen = true" class="bevel-btn p-2 flex flex-col gap-1 bg-[#c6c6c6]">
          <div class="w-5 h-1 bg-black"></div>
          <div class="w-5 h-1 bg-black"></div>
          <div class="w-5 h-1 bg-black"></div>
        </button>
        <h1 class="text-xl min-[480px]:text-2xl font-bold text-white flex items-center gap-2 drop-shadow-[2px_2px_0px_rgba(0,0,0,1)] whitespace-nowrap cursor-pointer" @click="goHome()">
          <span class="text-3xl">🧪</span> 과학 허브
        </h1>
      </div>
      <div class="flex gap-2 relative">
        <button @click="openModal('guide')" class="bevel-btn px-2 py-1 text-sm font-bold flex items-center bg-[#c6c6c6]">⚙️</button>
        <template x-if="view === 'main'">
          <button @click="openModal('password')" class="bevel-btn px-2 py-1 text-sm font-bold flex items-center bg-[#c6c6c6]">🔒 관리</button>
        </template>
        <template x-if="view === 'admin'">
          <button @click="goHome()" class="bevel-btn px-2 py-1 text-sm font-bold flex items-center bg-yellow-400 text-black">🏠 홈</button>
        </template>
      </div>
    </header>
    
    <div class="flex-1 overflow-y-auto relative z-10 w-full scrollable-panel pb-24">
      
      <!-- 메인 학생용 뷰 -->
      <template x-if="view === 'main'">
        <main class="p-4 flex flex-col gap-4 max-w-7xl mx-auto h-full">
          
          <div class="flex flex-col gap-3 mb-2 border-b-2 border-white/20 pb-4">
            <div class="flex justify-between items-center flex-wrap gap-2">
              <span class="text-xl font-bold text-yellow-300 drop-shadow-md flex items-center gap-2">
                📂 <span x-text="showFavoritesOnly ? '⭐ 내 즐겨찾기' : selectedCategory"></span>
              </span>
              <button @click="toggleFavoritesMode()" class="px-3 py-1 text-sm font-bold transition-colors"
                      :class="showFavoritesOnly ? 'bevel-box bg-yellow-400' : 'bevel-btn bg-[#c6c6c6] text-black'">
                <span x-text="showFavoritesOnly ? '전체 보기로 돌아가기' : '⭐ 즐겨찾기 모아보기'"></span>
              </button>
            </div>
            <!-- 실시간 검색창 -->
            <input type="text" x-model="searchQuery" placeholder="🔍 앱 이름, 단원명, 해시태그로 검색..." 
                   class="bevel-inset p-3 w-full text-black bg-white focus:outline-none focus:ring-2 focus:ring-yellow-400 font-bold" />
          </div>

          <!-- 소분류(Unit) 탭 (검색/즐겨찾기 모드가 아닐 때만 보임) -->
          <template x-if="!showFavoritesOnly && !searchQuery.trim()">
            <div class="flex flex-wrap gap-2 mb-4">
              <template x-for="unit in studentAvailableUnits" :key="unit">
                <button @click="selectedUnit = unit" class="px-3 py-1 text-sm font-bold transition-colors"
                        :class="selectedUnit === unit ? 'bevel-box bg-yellow-400' : 'bevel-btn bg-[#c6c6c6]'">
                  <span x-text="unit"></span>
                </button>
              </template>
            </div>
          </template>

          <!-- 앱 카드 그리드 (PC 3열, 모바일 1열 반응형) -->
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <template x-for="app in displayedApps" :key="app.id">
              <div class="bevel-box p-4 flex flex-col h-full bg-[#e5e5e5] hover:-translate-y-1 transition-transform relative">
                <!-- 즐겨찾기 별 버튼 -->
                <button @click.stop="toggleFavorite(app.id)" class="absolute top-4 right-4 text-3xl drop-shadow-md transition-transform hover:scale-110 active:scale-90" title="즐겨찾기">
                  <span x-text="favorites.includes(app.id) ? '⭐' : '☆'"></span>
                </button>

                <div class="flex justify-between items-start mb-4 pr-10">
                  <div class="flex items-center gap-3">
                    <div class="text-4xl p-2 bevel-inset bg-white drop-shadow-md relative">
                      <span x-text="app.emoji"></span>
                      <!-- HOT 배지 (조회수 상위 3위 또는 수동 지정 시) -->
                      <template x-if="app.isHot || isAutoHot(app)">
                        <span class="absolute -top-3 -right-3 bg-red-500 text-white text-[10px] px-1 py-0.5 font-bold border-2 border-white rounded-md transform rotate-12 drop-shadow-sm pointer-events-none">HOT</span>
                      </template>
                    </div>
                    <div>
                      <span class="text-xs bg-gray-700 text-white px-2 py-1 inline-block mb-1 font-bold" x-text="app.category + ' > ' + app.unit"></span>
                      <h3 class="font-bold text-lg leading-tight break-keep" x-text="app.name"></h3>
                      <div class="text-xs text-gray-600 mt-1 font-sans">조회수: <span x-text="app.views || 0"></span></div>
                    </div>
                  </div>
                </div>
                
                <!-- 해시태그 렌더링 -->
                <template x-if="app.tags">
                  <div class="flex flex-wrap gap-1 mb-3">
                    <template x-for="tag in String(app.tags).split(',').map(t=>t.trim()).filter(Boolean)" :key="tag">
                      <button @click="searchQuery = tag" class="text-xs bg-blue-200 text-blue-800 px-2 py-0.5 font-bold border border-blue-400 rounded-full hover:bg-blue-300">
                        #<span x-text="tag"></span>
                      </button>
                    </template>
                  </div>
                </template>
                
                <!-- 하단 액션 버튼부 -->
                <div class="mt-auto pt-2 flex gap-2">
                  <div class="flex-shrink-0">
                    <button @click="openQrModal(app)" class="bg-white p-2 bevel-inset-dark hover:scale-105 transition-transform text-2xl" title="QR 코드 보기">📱</button>
                  </div>
                  <button @click="openAppUrl(app)" class="bevel-btn flex-1 py-2 text-lg font-bold flex justify-center items-center gap-2 bg-green-400 hover:bg-green-300 active:bg-green-500 text-black">
                    ▶ OPEN
                  </button>
                </div>
              </div>
            </template>
            <!-- 검색/필터 결과 없음 -->
            <template x-if="displayedApps.length === 0">
              <div class="col-span-full bevel-inset-dark p-8 text-center text-white font-bold text-xl">
                <span x-text="searchQuery ? '검색 결과가 없습니다. 🪹' : '등록된 웹앱이 없습니다. 🪹'"></span>
              </div>
            </template>
          </div>
        </main>
      </template>

      <template x-if="view === 'admin'">
        <main class="p-4 flex flex-col gap-4 max-w-7xl mx-auto h-full">
          <div class="flex justify-between items-end mb-4 flex-wrap gap-4">
            <h2 class="text-2xl font-bold flex items-center gap-2 drop-shadow-[2px_2px_0px_rgba(0,0,0,1)]">
              <span class="text-3xl">🛠️</span> 관리자 패널
            </h2>
            <button @click="openFormModal(null)" class="bevel-btn bg-blue-400 px-6 py-2 font-bold flex items-center gap-2 text-black">
              ➕ 새 웹앱 추가
            </button>
          </div>

          <!-- 테이블 필터 컨트롤러 -->
          <div class="flex flex-wrap gap-3 mb-2 p-3 bg-[#8b8b8b] bevel-inset-dark items-center">
            <span class="font-bold text-sm text-white drop-shadow-md mr-2">🔍 목록 필터:</span>
            <select x-model="adminCategoryFilter" @change="adminUnitFilter = '전체'" class="bevel-btn bg-[#e5e5e5] p-2 text-sm font-bold text-black">
              <option value="전체">모든 대분류</option>
              <template x-for="c in allCategories" :key="c"><option :value="c" x-text="c"></option></template>
            </select>
            <select x-model="adminUnitFilter" class="bevel-btn bg-[#e5e5e5] p-2 text-sm font-bold text-black">
              <template x-for="u in adminAvailableUnits" :key="u">
                <option :value="u" x-text="u === '전체' ? '모든 소분류' : u"></option>
              </template>
            </select>
            <div class="ml-auto text-xs font-bold bg-[#373737] text-white px-3 py-2 border-2 border-[#ffffff] border-b-[#111111] border-r-[#111111]">
              총 <span x-text="adminDisplayedApps.length"></span>개
            </div>
          </div>

          <!-- 웹앱 관리 테이블 -->
          <div class="bevel-box overflow-x-auto bg-[#c6c6c6] p-2">
            <table class="w-full text-sm text-left min-w-[900px]">
              <thead class="bg-[#8b8b8b] text-white">
                <tr>
                  <th class="p-3 border-2 border-[#373737]">상태/예약</th>
                  <th class="p-3 border-2 border-[#373737]">순위</th>
                  <th class="p-3 border-2 border-[#373737]">대/소분류</th>
                  <th class="p-3 border-2 border-[#373737]">앱 정보 (이름/URL/태그)</th>
                  <th class="p-3 border-2 border-[#373737]">조회수</th>
                  <th class="p-3 border-2 border-[#373737]">관리</th>
                </tr>
              </thead>
              <tbody class="bg-[#e5e5e5]">
                <template x-for="app in adminDisplayedApps" :key="app.id">
                  <tr class="border-b-2 border-[#c6c6c6] hover:bg-gray-100" :class="app.isHidden ? 'opacity-50' : ''">
                    <td class="p-3 border-2 border-[#373737] font-bold text-center space-y-1">
                      <span x-show="app.isHidden" class="block text-xs bg-gray-500 text-white rounded px-1">비공개</span>
                      <span x-show="!app.isHidden" class="block text-xs bg-green-500 text-white rounded px-1">공개</span>
                      <span x-show="app.isHot" class="block text-xs bg-red-500 text-white rounded px-1">🔥 수동HOT</span>
                      <span x-show="isFuture(app.openDate)" class="block text-xs bg-purple-500 text-white rounded px-1">⏳ 예약됨</span>
                    </td>
                    <td class="p-3 border-2 border-[#373737] font-bold text-center text-lg" x-text="(app.order === '' || app.order == null) ? 999 : app.order"></td>
                    <td class="p-3 border-2 border-[#373737] font-bold">
                      <div class="text-blue-700" x-text="app.category"></div>
                      <div class="text-gray-600 text-xs" x-text="app.unit"></div>
                    </td>
                    <td class="p-3 border-2 border-[#373737] font-bold">
                      <div class="flex items-center gap-2">
                        <span class="text-xl" x-text="app.emoji"></span>
                        <span x-text="app.name"></span>
                      </div>
                      <div class="text-xs font-normal text-blue-500 mt-1 truncate max-w-[250px]" x-text="app.url"></div>
                      <div class="text-xs text-gray-500 mt-1" x-show="app.tags" x-text="'#' + app.tags"></div>
                    </td>
                    <td class="p-3 border-2 border-[#373737] font-bold text-center text-lg text-blue-600" x-text="app.views || 0"></td>
                    <td class="p-3 border-2 border-[#373737]">
                      <div class="flex gap-2">
                        <button @click="openFormModal(app)" class="bevel-btn px-2 py-1 bg-yellow-300 text-xs font-bold text-black">수정</button>
                        <button @click="openModal('confirmDelete', app)" class="bevel-btn px-2 py-1 bg-red-400 text-xs font-bold text-white">삭제</button>
                      </div>
                    </td>
                  </tr>
                </template>
                <template x-if="adminDisplayedApps.length === 0">
                  <tr><td colspan="6" class="p-4 text-center font-bold text-black">조건에 맞는 데이터가 없습니다.</td></tr>
                </template>
              </tbody>
            </table>
          </div>
        </main>
      </template>
    </div>

    <!-- 푸터 워터마크 -->
    <footer class="text-center p-2 bg-[#2d3748] border-t-4 border-[#111] z-40 text-xs font-bold text-white/50" style="padding-bottom: max(8px, var(--safe-bottom))">
      Created by Yang DH
    </footer>

    <!-- 통신 로딩 스피너 -->
    <div x-show="loading" style="display: none;" class="fixed inset-0 z-[200] bg-black/70 flex flex-col items-center justify-center backdrop-blur-sm">
      <div class="text-6xl animate-bounce drop-shadow-[0_0_10px_rgba(255,255,255,0.8)]">⛏️</div>
      <div class="mt-4 text-white font-bold text-xl tracking-widest animate-pulse">데이터 통신 중...</div>
    </div>

    <!-- 모달 오버레이 (appForm 상태일 때는 배경 클릭 무시) -->
    <div x-show="modal.type !== null" style="display: none;" class="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4" style="padding-bottom: max(16px, var(--safe-bottom))" 
         @click="if(modal.type !== 'appForm') closeModal()">
      <div class="bevel-box w-full max-w-md max-h-[90dvh] overflow-y-auto scrollable-panel p-6 flex flex-col bg-[#c6c6c6]" @click.stop>
        
        <!-- 비밀번호 모달 -->
        <template x-if="modal.type === 'password'">
          <div>
            <h3 class="text-xl font-bold mb-4 text-black">관리자 인증</h3>
            <p class="mb-4 text-sm text-gray-700 font-bold">비밀번호를 입력하세요.</p>
            <input type="password" id="pwInput" class="bevel-inset w-full p-3 mb-6 text-black bg-[#e5e5e5] font-sans" @keyup.enter="verifyAdmin()" />
            <div class="flex justify-end gap-2 mt-auto">
              <button @click="closeModal()" class="bevel-btn px-4 py-2 bg-gray-400 text-black font-bold">취소</button>
              <button @click="verifyAdmin()" class="bevel-btn px-4 py-2 bg-blue-400 font-bold text-black">확인</button>
            </div>
          </div>
        </template>

        <!-- 알럿 모달 -->
        <template x-if="modal.type === 'alert'">
          <div>
            <h3 class="text-xl font-bold mb-4 text-red-600">알림</h3>
            <p class="mb-6 text-black font-bold" x-text="modal.data"></p>
            <div class="flex justify-end mt-auto">
              <button @click="closeModal()" class="bevel-btn px-6 py-2 bg-blue-400 font-bold text-black">확인</button>
            </div>
          </div>
        </template>

        <!-- 삭제 확인 모달 -->
        <template x-if="modal.type === 'confirmDelete'">
          <div>
            <h3 class="text-xl font-bold mb-4 text-red-600">삭제 확인</h3>
            <p class="mb-6 break-keep text-black font-bold">정말 <b>[<span x-text="modal.data?.name || ''"></span>]</b> 앱을 삭제하시겠습니까? 되돌릴 수 없습니다.</p>
            <div class="flex justify-end gap-2 mt-auto">
              <button @click="closeModal()" class="bevel-btn px-4 py-2 bg-gray-400 text-black font-bold">취소</button>
              <button @click="syncAppAction('delete', modal.data); closeModal()" class="bevel-btn px-4 py-2 bg-red-400 font-bold text-white">삭제하기</button>
            </div>
          </div>
        </template>

        <!-- QR 코드 및 주소 복사 모달 (원클릭 박스형 복사 통합) -->
        <template x-if="modal.type === 'qr'">
          <div class="flex flex-col items-center w-full">
            <h3 class="text-2xl font-bold mb-2 text-black text-center" x-text="modal.data?.name || ''"></h3>
            
            <button @click="copyText($event, modal.data?.url)" class="bevel-btn w-full mb-6 p-2 text-xs font-sans text-left flex justify-between items-center bg-[#e5e5e5] hover:bg-white transition-colors group" title="클릭하여 주소 복사">
              <span class="truncate mr-2 text-gray-700" x-text="modal.data?.url || ''"></span>
              <span class="flex-shrink-0 bg-[#c6c6c6] px-2 py-1 text-[10px] font-bold border border-gray-400 group-hover:bg-blue-200 transition-colors">📋 복사</span>
            </button>

        <template x-if="modal.type === 'guide'">

            <div class="bg-[#1e1e1e] text-[#d4d4d4] p-4 font-mono text-xs overflow-auto h-64 bevel-inset-dark mb-4 text-left whitespace-pre break-all select-all" x-text="gasCodeText"></div>
            <div class="text-sm space-y-2 mb-4 font-bold text-gray-800">

              <!-- 공용 복사 함수 재활용 -->
              <button @click="copyText($event, gasCodeText)" class="bevel-btn px-4 py-2 bg-green-400 font-bold text-black">📄 코드 복사하기</button>

      </div>

  </div>

  <script>
    // --- 글로벌 설정 변수 ---
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxCLy0uYsCLRYn2ARZuWVF7bs-z2edBf5bsf_sdPTpyTTO3HmP_i9prjSz5ukNFLCU/exec"; // TODO: 실제 앱스 스크립트 웹앱 주소 입력
    const UNITS = ['1단원', '2단원', '3단원', '4단원', '5단원', '6단원', '7단원', '8단원'];
    const DEFAULT_CATEGORIES = ['중1 과학', '중2 과학', '중3 과학', '수업 영상', '공지/정보'];
    
    // GAS 미연결 시 표시될 로컬 더미 데이터
    const DUMMY_DATA = [
      { id: 'app_1', category: '중2 과학', unit: '1단원', name: '원소 불꽃반응 실험', url: 'https://example.com/fire', emoji: '🔥', isHidden: false, isHot: false, date: '2026-06-01', views: 150, order: 1 },
      { id: 'app_2', category: '중2 과학', unit: '2단원', name: '전자기 유도 발전기', url: 'https://example.com/elec', emoji: '⚡', isHidden: false, isHot: false, date: '2026-06-02', views: 80, tags: '시뮬레이션', order: 2 },
      { id: 'app_3', category: '중3 과학', unit: '3단원', name: '태양계 행성 크기 비교', url: 'https://example.com/space', emoji: '🪐', isHidden: false, isHot: false, date: '2026-06-03', views: 210, tags: '우주,AR', order: 999 },
    ];

    // iOS Safe Area 100vh 버그 픽스 헬퍼
    const setVH = () => document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
    window.addEventListener('resize', setVH); setVH();
    
    // 한국어 자연 정렬 헬퍼
    const naturalSort = (a, b) => new Intl.Collator('ko', { numeric: true, sensitivity: 'base' }).compare(a, b);

    document.addEventListener('alpine:init', () => {
      Alpine.data('appData', () => ({
        view: 'main', apps: [], loading: false,
        selectedCategory: '중2 과학', selectedUnit: '전체', isSidebarOpen: false,
        searchQuery: '', favorites: [], showFavoritesOnly: false,
        adminPw: '', modal: { type: null, data: null },
        adminCategoryFilter: '전체', adminUnitFilter: '전체',
        formData: {}, formError: '',
        
        // 메모리 변수: 이전 작업 카테고리 기억용
        lastCategory: '중2 과학',
        lastUnit: '1단원',
        
        // 백엔드 통신 및 동시성 제어(LockService) 적용 앱스 스크립트 코드
        gasCodeText: `function doGet(e) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName('Apps');
  if(!sheet) return ContentService.createTextOutput(JSON.stringify([])).setMimeType(ContentService.MimeType.JSON);
  
  if (e && e.parameter && e.parameter.action === 'verify') {
    var settingsSheet = ss.getSheetByName('Settings');
    if (!settingsSheet) return ContentService.createTextOutput(JSON.stringify({result: 'error'})).setMimeType(ContentService.MimeType.JSON);
    var actualPw = String(settingsSheet.getRange(1, 2).getValue()).trim();
    var inputPw = String(e.parameter.password).trim();
    if (actualPw === inputPw) return ContentService.createTextOutput(JSON.stringify({result: 'success'})).setMimeType(ContentService.MimeType.JSON);
    return ContentService.createTextOutput(JSON.stringify({result: 'error', message: '비밀번호가 일치하지 않습니다.'})).setMimeType(ContentService.MimeType.JSON);
  }

  var data = sheet.getDataRange().getValues();
  if(data.length < 2) return ContentService.createTextOutput(JSON.stringify([])).setMimeType(ContentService.MimeType.JSON);
  var headers = data[0]; var result = [];
  for(var i=1; i<data.length; i++) {
    var obj = {};
    for(var j=0; j<headers.length; j++) obj[headers[j]] = data[i][j];
    result.push(obj);
  }
  return ContentService.createTextOutput(JSON.stringify(result)).setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  var lock = LockService.getScriptLock();
  try {
    lock.waitLock(10000); // 동시성 문제 방지 (최대 10초 대기)
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ result: 'error', message: '서버가 혼잡합니다. 잠시 후 다시 시도해주세요.' })).setMimeType(ContentService.MimeType.JSON);
  }

  try {
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var sheet = ss.getSheetByName('Apps');
    if(!sheet) {
      sheet = ss.insertSheet('Apps');
      sheet.appendRow(['id', 'category', 'unit', 'name', 'url', 'emoji', 'isHidden', 'isHot', 'date', 'views', 'tags', 'openDate', 'order']);
      sheet.getRange(1, 1, 1, 13).setFontWeight('bold').setBackground('#4a86e8').setFontColor('#ffffff');
    }
    var settingsSheet = ss.getSheetByName('Settings');
    if(!settingsSheet) {
      settingsSheet = ss.insertSheet('Settings');
      settingsSheet.appendRow(['관리자 비밀번호', 'science123']);
      settingsSheet.getRange(1, 1, 1, 2).setFontWeight('bold').setBackground('#f4cccc');
      settingsSheet.setColumnWidth(1, 150);
    }
    
    var req = JSON.parse(e.postData.contents);
    var action = req.action; var data = req.data;
    
    var headers = sheet.getRange(1, 1, 1, sheet.getLastColumn()).getValues()[0];
    var rowData = [];
    if(action === 'create' || action === 'update') {
      for (var key in data) {
        if (headers.indexOf(key) === -1) { headers.push(key); sheet.getRange(1, headers.length).setValue(key); }
      }
      for (var j=0; j<headers.length; j++) rowData.push(data[headers[j]] !== undefined ? data[headers[j]] : '');
    }

    if (action === 'create') {
      sheet.appendRow(rowData);
    } else if (action === 'update') {
      var sheetData = sheet.getDataRange().getValues();
      for(var i=1; i<sheetData.length; i++) {
        if(sheetData[i][0] === data.id) { sheet.getRange(i+1, 1, 1, rowData.length).setValues([rowData]); break; }
      }
    } else if (action === 'delete') {
      var sheetData = sheet.getDataRange().getValues();
      for(var i=1; i<sheetData.length; i++) {
        if(sheetData[i][0] === data.id) { sheet.deleteRow(i+1); break; }
      }
    } else if (action === 'incrementView') {
      var sheetData = sheet.getDataRange().getValues();
      var viewIdx = headers.indexOf('views');
      if(viewIdx === -1) { headers.push('views'); sheet.getRange(1, headers.length).setValue('views'); viewIdx = headers.length - 1; }
      for(var i=1; i<sheetData.length; i++) {
        if(sheetData[i][0] === data.id) {
          var currView = parseInt(sheetData[i][viewIdx]) || 0;
          sheet.getRange(i+1, viewIdx + 1).setValue(currView + 1);
          break;
        }
      }
    }
    return ContentService.createTextOutput(JSON.stringify({ result: 'success' })).setMimeType(ContentService.MimeType.JSON);
  } catch(err) {
    return ContentService.createTextOutput(JSON.stringify({ result: 'error', message: err.toString() })).setMimeType(ContentService.MimeType.JSON);
  } finally {
    lock.releaseLock();
  }
}`,

        init() {
          const savedFavs = localStorage.getItem('science_hub_favs');
          if (savedFavs) { try { this.favorites = JSON.parse(savedFavs); } catch (e) {} }
          
          window.addEventListener('popstate', (e) => {
            if(this.modal.type) { this.closeModal(); return; }
            this.view = (e.state && e.state.view) || 'main';
          });
          
          const draft = localStorage.getItem('draft_appData');
          if (draft) { try { this.formData = JSON.parse(draft); } catch(e){} }
          
          this.fetchApps();
        },

        // 데이터 Fetch 로직
        async fetchApps() {
          if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL === "") { this.apps = DUMMY_DATA; return; }
          this.loading = true;
          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 8000);
            const res = await fetch(GOOGLE_SCRIPT_URL, { signal: controller.signal });
            clearTimeout(timeoutId);
            const data = await res.json();
            this.apps = Array.isArray(data) ? data.map(app => ({
              ...app,
              isHidden: app.isHidden === true || app.isHidden === 'true',
              isHot: app.isHot === true || app.isHot === 'true',
              views: parseInt(app.views) || 0,
              order: (app.order === '' || app.order == null) ? 999 : Number(app.order)
            })) : [];
          } catch(err) {
            console.error("Fetch Error:", err);
            this.openModal('alert', '데이터 통신 실패! GAS URL이 올바른지 확인해주세요.');
            this.apps = DUMMY_DATA;
          } finally {
            this.loading = false;
          }
        },

        // 데이터 동기화 (CRUD) 로직
        async syncAppAction(action, data) {
          if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL === "") {
            if(action === 'create') this.apps.push({ ...data, date: new Date().toISOString() });
            if(action === 'update') this.apps = this.apps.map(a => a.id === data.id ? data : a);
            if(action === 'delete') this.apps = this.apps.filter(a => a.id !== data.id);
            if(action === 'incrementView') { const app = this.apps.find(a=>a.id===data.id); if(app) app.views = (app.views||0)+1; }
            return true;
          }
          if(action !== 'incrementView') this.loading = true;
          try {
            await Promise.race([
              fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST', mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action, data, password: this.adminPw })
              }),
              new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 8000))
            ]);
            if(action !== 'incrementView') await this.fetchApps();
            return true;
          } catch(err) {
            if(action !== 'incrementView') this.openModal('alert', '서버 통신 실패! 데이터가 제대로 저장되지 않았을 수 있습니다.');
            return false;
          } finally {
            if(action !== 'incrementView') this.loading = false;
          }
        },

        async verifyAdmin() {
          const inputPw = document.getElementById('pwInput').value;
          if(!inputPw) return;
          if(!GOOGLE_SCRIPT_URL) { this.adminPw = inputPw; this.closeModal(); this.goAdmin(); return; }
          this.loading = true;
          try {
            const url = new URL(GOOGLE_SCRIPT_URL);
            url.searchParams.append('action', 'verify');
            url.searchParams.append('password', inputPw);
            const res = await Promise.race([
              fetch(url.toString(), { redirect: 'follow' }),
              new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 8000))
            ]);
            const data = await res.json();
            if(data.result === 'success') {
              this.adminPw = inputPw; this.closeModal(); this.goAdmin();
            } else {
              this.openModal('alert', data.message || '비밀번호가 일치하지 않습니다.');
            }
          } catch(err) {
            console.error(err);
            this.openModal('alert', '인증 오류. URL과 배포 권한(모든 사용자)을 확인하세요.');
          } finally {
            this.loading = false;
          }
        },

        goHome() { this.view = 'main'; this.searchQuery = ''; this.showFavoritesOnly = false; history.pushState({view: 'main'}, ''); },
        goAdmin() { this.view = 'admin'; history.pushState({view: 'admin'}, ''); },
        
        get allCategories() { return Array.from(new Set([...DEFAULT_CATEGORIES, ...this.apps.map(a=>a.category).filter(Boolean)])).sort(naturalSort); },
        get allUnits() { return Array.from(new Set([...UNITS, ...this.apps.map(a=>a.unit).filter(Boolean)])).sort(naturalSort); },
        get studentAvailableUnits() {
          const u = this.apps.filter(a => a.category === this.selectedCategory && !a.isHidden).map(a => a.unit);
          return ['전체', ...Array.from(new Set(u)).sort(naturalSort)];
        },
        get adminAvailableUnits() {
          if (this.adminCategoryFilter === '전체') return ['전체', ...this.allUnits];
          return ['전체', ...Array.from(new Set(this.apps.filter(a => a.category === this.adminCategoryFilter).map(a => a.unit))).sort(naturalSort)];
        },
        
        get top3ViewsIds() {
          return [...this.apps].filter(a => !a.isHidden && (a.views||0) > 0).sort((a,b) => b.views - a.views).slice(0,3).map(a=>a.id);
        },
        isAutoHot(app) { return this.top3ViewsIds.includes(app.id); },
        isFuture(dateStr) { return dateStr ? new Date(dateStr) > new Date() : false; },

        get displayedApps() {
          let f = this.apps.filter(a => !a.isHidden && !this.isFuture(a.openDate));
          if (this.showFavoritesOnly) { f = f.filter(a => this.favorites.includes(a.id)); } 
          else {
            f = f.filter(a => a.category === this.selectedCategory);
            if (this.selectedUnit !== '전체') f = f.filter(a => a.unit === this.selectedUnit);
          }
          if (this.searchQuery.trim()) {
            const q = this.searchQuery.toLowerCase();
            f = this.apps.filter(a => !a.isHidden && !this.isFuture(a.openDate) && 
                (a.name.toLowerCase().includes(q) || a.category.toLowerCase().includes(q) || 
                 a.unit.toLowerCase().includes(q) || (a.tags && String(a.tags).toLowerCase().includes(q))));
          }
          return f.sort((a,b) => {
            const oA = (a.order === '' || a.order == null) ? 999 : Number(a.order);
            const oB = (b.order === '' || b.order == null) ? 999 : Number(b.order);
            if (oA !== oB) return oA - oB;
            return new Date(b.date) - new Date(a.date);
          });
        },
        get adminDisplayedApps() {
          let f = this.apps;
          if (this.adminCategoryFilter !== '전체') f = f.filter(a => a.category === this.adminCategoryFilter);
          if (this.adminUnitFilter !== '전체') f = f.filter(a => a.unit === this.adminUnitFilter);
          return f.sort((a,b) => {
            const oA = (a.order === '' || a.order == null) ? 999 : Number(a.order);
            const oB = (b.order === '' || b.order == null) ? 999 : Number(b.order);
            if (oA !== oB) return oA - oB;
            return new Date(b.date) - new Date(a.date);
          });
        },

        selectCategory(cat) { this.selectedCategory = cat; this.selectedUnit = '전체'; this.showFavoritesOnly = false; this.isSidebarOpen = false; },
        toggleFavoritesMode() { this.showFavoritesOnly = !this.showFavoritesOnly; this.searchQuery = ''; },
        toggleFavorite(id) {
          const idx = this.favorites.indexOf(id);
          if(idx>-1) this.favorites.splice(idx,1); else this.favorites.push(id);
          localStorage.setItem('science_hub_favs', JSON.stringify(this.favorites));
        },
        openModal(type, data = null) { this.modal = { type, data }; history.pushState({modal: type}, ''); },
        closeModal() { this.modal = { type: null, data: null }; },
        
        openFormModal(app) {
          const isEdit = !!(app && app.id);
          this.formData = isEdit ? { ...app } : { 
            category: this.lastCategory, 
            unit: this.lastUnit,         
            name: '', url: '', emoji: '🧪', tags: '', isHidden: false, isHot: false, openDate: '', order: 999 
          };
          this.formError = ''; this.openModal('appForm');
        },
        
        saveDraft() { localStorage.setItem('draft_appData', JSON.stringify(this.formData)); },
        
        async submitForm() {
          if(!this.formData.name || !this.formData.url || !this.formData.emoji || !this.formData.category || !this.formData.unit) {
            this.formError = '모든 필수 항목을 입력해주세요.'; return;
          }
          this.formError = '';
          
          const action = this.formData.id ? 'update' : 'create';
          if(action === 'create') { 
            this.formData.id = 'app_' + Date.now().toString(); 
            this.formData.views = 0; 
            this.formData.date = new Date().toISOString(); 
          }
          this.formData.order = (this.formData.order === '' || this.formData.order == null) ? 999 : Number(this.formData.order);
          
          const success = await this.syncAppAction(action, this.formData);
          if(success) { 
            if(action === 'create') {
              this.lastCategory = this.formData.category; 
              this.lastUnit = this.formData.unit;
            }
            localStorage.removeItem('draft_appData'); 
            this.closeModal(); 
          }
        },

        openAppUrl(app) {
          app.views = (app.views || 0) + 1;
          this.syncAppAction('incrementView', { id: app.id }); 
          window.open(app.url, '_blank');
        },
        
        openQrModal(app) {
          this.openModal('qr', app);
          this.$nextTick(() => {
            const container = document.getElementById('qrcode');
            container.innerHTML = '';
            new QRCode(container, {
              text: app.url, width: 200, height: 200,
              correctLevel: QRCode.CorrectLevel.M, colorDark: "#000000", colorLight: "#ffffff"
            });
          });
        },
        
        // 공용 텍스트 복사 함수 (iOS 스크롤 점프 완벽 차단 폴백 적용)
        async copyText(e, textToCopy) {
          if (!textToCopy) return;
          const btn = e.currentTarget; 
          const originalHTML = btn.innerHTML;
          
          try {
            if(navigator.clipboard && window.isSecureContext) {
              await navigator.clipboard.writeText(textToCopy);
            } else {
              throw new Error('Clipboard API Error');
            }
          } catch(err) {
            const textArea = document.createElement("textarea");
            textArea.value = textToCopy;
            // 스크롤 튐 방지: absolute 처리 후 현재 scrollY 값 할당
            textArea.style.position = "absolute"; 
            textArea.style.left = "-999999px"; 
            textArea.style.top = window.scrollY + "px";
            document.body.appendChild(textArea); textArea.focus(); textArea.select();
            try { 
              document.execCommand('copy'); 
            } catch(e2) { 
              btn.innerHTML = "<span class='w-full text-center text-red-600 font-bold'>❌ 복사 실패</span>"; 
              setTimeout(() => btn.innerHTML = originalHTML, 2000); 
              return; 
            }
            textArea.remove();
          }
          
          btn.innerHTML = "<span class='w-full text-center text-green-700 font-bold'>✅ 복사 완료!</span>";
          btn.classList.add('bg-green-200');
          setTimeout(() => {
            btn.innerHTML = originalHTML;
            btn.classList.remove('bg-green-200');
          }, 2000);
        }
      }));
    });
  </script>
</body>
</html>
